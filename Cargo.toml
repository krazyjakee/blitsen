[workspace]
members = [
    "crates/blitsen",
    "crates/blitsen-blitz",
    "crates/blitsen-core",
    "crates/blitsen-dom",
    "crates/blitsen-host",
    "crates/blitsen-jsc",
    "crates/blitsen-js",
    "crates/blitsen-node",
    "crates/blitsen-platform",
    "crates/blitsen-runtime",
]
exclude = ["spikes/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krazyjakee/blitsen"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
anyrender = { git = "https://github.com/DioxusLabs/anyrender", rev = "dcd219746ff13a5832beab552f3f7f494d1bd84d" }

# Phase 3 size work (issue #89). Measured, not adopted: `size:phase2` reports
# what each lever is worth, and the release profile changes when the numbers
# justify the build time. `panic = "abort"` is deliberately absent — the native
# callback boundary in `blitsen-jsc` turns a panic into a JavaScript exception
# with `catch_unwind`, and aborting instead would take the process down.
[profile.release-min]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
