[workspace]
members = [
    "crates/blitsen",
    "crates/blitsen-android",
    "crates/blitsen-blitz",
    "crates/blitsen-core",
    "crates/blitsen-dom",
    "crates/blitsen-host",
    "crates/blitsen-js",
    "crates/blitsen-node",
    "crates/blitsen-platform",
    "crates/blitsen-quickjs",
    "crates/blitsen-runtime",
]
exclude = ["spikes/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor a source builder can actually use, rather than an aspiration. This
# said 1.89 until #277, and the locked graph had already outgrown it: `sysinfo`,
# which `blitsen-platform` depends on unconditionally, declares 1.95, so anyone
# who selected 1.89 out of this metadata failed inside a dependency before
# reaching a line of Blitsen. Nothing tested 1.89 either, which is how it drifted.
#
# Target-specific dependencies count towards this number and were checked, not
# assumed: the highest of them is macOS's `mac-usernotifications` 0.3.1 at 1.90,
# which is under the floor `sysinfo` already sets and so asks for nothing. That
# remains enforced from Linux because the `msrv` job parses locked metadata and
# rejects every resolved package whose declared minimum exceeds this one; Cargo
# reports dependencies behind other platforms' target predicates in metadata.
#
# The job also compiles the active Linux graph with exactly this compiler. The
# normal matrix compiles the platform-specific graphs on Linux, macOS and Windows.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krazyjakee/blitsen"
publish = false

[workspace.dependencies]
# Every encoder in the tree writes or reads the standard padded alphabet and
# needs only the crate's allocation support, not its unrelated `std` surface.
# Hoisted so one crate cannot quietly re-enable defaults for the others through
# feature unification.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Accessibility is deliberately outside v1 (#102). Upstream `blitz` enables
# its AccessKit platform adapter by default, so every direct user inherits this
# one explicit feature decision instead. `net` and `tracing` are the other two
# upstream defaults and remain part of the runtime.
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73", default-features = false, features = ["net", "tracing"] }
# The same pinned revision as `blitz` above, spelled once. These two are named
# directly by crates only to enable features the meta-crate leaves off —
# system-fonts, woff, file-input, custom-widget, svg — via unification; each use
# site keeps its own feature list and the rationale beside it.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73", default-features = false }
parking_lot = "0.12.5"
# Featureless on purpose: `blitsen-node` uses serde without `derive`
# deliberately, so the workspace entry must not force it on; every other user
# adds `features = ["derive"]` at its own site.
serde = "1"
serde_json = "1"
tempfile = "3"
# Exact because a pre-release makes no compatibility promise between betas:
# both hosts must resolve to the same revision, spelled once here, until
# winit 0.31 stabilises.
winit = "=0.31.0-beta.2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Symbols are 13.1 MB of the 50.1 MB Phase 2 runtime and nothing that ships
# reads them: the executable is what a user downloads, and a backtrace taken
# from it names frames the reporter cannot map to a source line anyway. Dropped
# here rather than in the release workflow so a checkout's own `blitsen build`
# weighs what a released one does. Debugging a release build is
# `--profile release-dbg`, which is this profile with its symbols back.
[profile.release]
strip = "symbols"

[profile.release-dbg]
inherits = "release"
strip = "none"
debug = "line-tables-only"

# Phase 3 size work (issue #89). Measured, not adopted: `size:phase2` reports
# what each lever is worth, and the release profile changes when the numbers
# justify the build time. `panic = "abort"` is deliberately absent — the native
# callback boundary in `blitsen-quickjs` turns a panic into a JavaScript exception
# with `catch_unwind`, and aborting instead would take the process down.
[profile.release-min]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
