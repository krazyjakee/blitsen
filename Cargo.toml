[workspace]
members = [
    "crates/blitsen",
    "crates/blitsen-android",
    "crates/blitsen-blitz",
    "crates/blitsen-core",
    "crates/blitsen-dom",
    "crates/blitsen-host",
    "crates/blitsen-js",
    "crates/blitsen-node",
    "crates/blitsen-platform",
    "crates/blitsen-quickjs",
    "crates/blitsen-runtime",
]
exclude = ["spikes/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krazyjakee/blitsen"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Symbols are 13.1 MB of the 50.1 MB Phase 2 runtime and nothing that ships
# reads them: the executable is what a user downloads, and a backtrace taken
# from it names frames the reporter cannot map to a source line anyway. Dropped
# here rather than in the release workflow so a checkout's own `blitsen build`
# weighs what a released one does. Debugging a release build is
# `--profile release-dbg`, which is this profile with its symbols back.
[profile.release]
strip = "symbols"

[profile.release-dbg]
inherits = "release"
strip = "none"
debug = "line-tables-only"

# Phase 3 size work (issue #89). Measured, not adopted: `size:phase2` reports
# what each lever is worth, and the release profile changes when the numbers
# justify the build time. `panic = "abort"` is deliberately absent — the native
# callback boundary in `blitsen-quickjs` turns a panic into a JavaScript exception
# with `catch_unwind`, and aborting instead would take the process down.
[profile.release-min]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
