version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
  # The blitz crates in Cargo.toml are pinned to a git rev on purpose and moved
  # by hand when the port is ready for it; Dependabot only updates registry
  # dependencies, so it will not touch that pin.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    ignore:
      # Pinned exactly to the version `windows = "0.62"` pairs with (see
      # crates/blitsen-host/Cargo.toml). Moving it alone lets cpal's `windows`
      # resolve against a different `windows-core` and the COM vtables stop
      # matching (#380); the two move together by hand.
      - dependency-name: windows-core
