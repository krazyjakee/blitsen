name: Release

# Builds, signs and publishes the six platform runtimes and the `blitsen` package.
#
# Defaults to a dry run. Publishing takes a deliberate `publish: true` on a
# manual dispatch, because `npm publish` cannot be undone: a version is burned
# the moment it lands, and unpublishing is a 72-hour window and a bad look.
#
# What this workflow does NOT do is notarise. Notarisation is a submission to
# Apple that takes minutes to hours and needs an App Store Connect key; it is a
# separate step against the artifacts this produces, and pretending to do it
# inline would make the release time unpredictable for no benefit. macOS code
# *signing* is here, because it is local and fast. See docs/RELEASING.md.
#
# Every signing step is skipped, loudly, when its secret is absent — so the
# workflow is runnable end to end on a fork with no credentials at all, which is
# the only way any of it gets tested before a real release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (otherwise pack and dry-run only)"
        type: boolean
        default: false
      tag:
        description: "npm dist-tag to publish under"
        type: string
        default: latest

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.98.0
  # Release persists only compact Cargo registries. It never restores a target
  # tree containing a staged binary, so every published artifact is rebuilt.

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate npm distribution tag
        shell: bash
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: bash scripts/release-summary.sh validate-tag "$DIST_TAG"
      - name: Establish the release version
        id: release_version
        shell: bash
        run: |
          version=$(bun scripts/release-version.mjs manifests \
            packages/blitsen/package.json packages/platforms/*/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building native release $version"

  # One native runner per target. Cross-compilation is deliberately not used
  # here: #84 settled that the engine's artifacts are built and tested natively
  # per OS, and a runtime that was never executed on its own platform is not
  # evidence of anything. What that choice costs is measured per target in the
  # job summary rather than assumed (open question 11).
  #
  # Three labels are overridable by repository variable. The two arm64 ones
  # because GitHub's free arm64 runners are **public repositories only**: this
  # repository is public, so `ubuntu-22.04-arm` and `windows-11-arm` schedule
  # for it and the defaults below are the ones that run — set
  # LINUX_ARM64_RUNNER or WIN32_ARM64_RUNNER if that stops being true.
  #
  # `darwin-x64` is the third, and it is overridable because the Intel macOS
  # image is the one that moves: `macos-13` queued indefinitely here — 40
  # minutes without a runner across two dispatches, while every other label
  # picked one up inside a minute — so the default is the current Intel image
  # and DARWIN_X64_RUNNER is how it moves again without a commit.
  build:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BLITSEN_RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            library: libblitsen_node.so
            executable: blitsen-runtime
            reproducible: true
          - target: linux-arm64
            runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-22.04-arm' }}
            library: libblitsen_node.so
            executable: blitsen-runtime
            reproducible: false
          - target: darwin-x64
            runner: ${{ vars.DARWIN_X64_RUNNER || 'macos-15-intel' }}
            library: libblitsen_node.dylib
            executable: blitsen-runtime
            reproducible: true
          - target: darwin-arm64
            runner: macos-latest
            library: libblitsen_node.dylib
            executable: blitsen-runtime
            reproducible: false
          - target: win32-x64
            runner: windows-2022
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
            reproducible: true
          - target: win32-arm64
            runner: ${{ vars.WIN32_ARM64_RUNNER || 'windows-11-arm' }}
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
            reproducible: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: started
        shell: bash
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-release-registry
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Blitz links these directly on Linux; macOS and Windows carry their own.
      - name: Install Blitz system dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev

      # Two artifacts, one ABI: the addon `blitsen run` loads, and the Phase 2
      # executable an export links into (#88). They are built together and
      # published together because a package carrying one without the other
      # fails at whichever command needs the missing half.
      - name: Build the runtime
        shell: bash
        run: |
          # The selected reproducibility rows must compile independently. Build
          # the first copy through the same canonical source pathname that the
          # second clean clone will use. MSVC retains that pathname as UTF-16 in
          # release objects even with rustc remapping and cl.exe /pathmap.
          if [ "${{ matrix.reproducible }}" = true ]; then
            reproducible_source="$RUNNER_TEMP/blitsen-repro-source"
            reproducible_target="$RUNNER_TEMP/blitsen-repro-target"
            git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$reproducible_source"
            git -C "$reproducible_source" checkout --quiet --detach "$GITHUB_SHA"
            (
              cd "$reproducible_source"
              CARGO_TARGET_DIR="$reproducible_target" \
                bash scripts/build-release-runtime.sh "${{ matrix.target }}"
            )
            test ! -e "$GITHUB_WORKSPACE/target"
            mv "$reproducible_target" "$GITHUB_WORKSPACE/target"
          else
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              bash scripts/build-release-runtime.sh "${{ matrix.target }}"
          fi

      # A platform package is its committed manifest plus exactly these artifacts.
      - name: Stage the runtime
        shell: bash
        run: |
          cp "target/release/${{ matrix.library }}" "packages/platforms/${{ matrix.target }}/blitsen.node"
          cp "target/release/${{ matrix.executable }}" "packages/platforms/${{ matrix.target }}/${{ matrix.executable }}"

      # Run the executable from the actual package staging directory. The main
      # manifest is authoritative, the selected platform manifest must agree,
      # and the compiled report must agree with both before signing or packing.
      - name: Check the staged runtime version
        shell: bash
        run: |
          bun scripts/release-version.mjs runtime \
            "packages/platforms/${{ matrix.target }}/${{ matrix.executable }}" \
            packages/blitsen/package.json \
            "packages/platforms/${{ matrix.target }}/package.json"

      # Signing timestamps are intentionally variable, so reproducibility is a
      # property of these unsigned Cargo outputs. Record all six targets' hashes
      # and do a second independent compile for one pinned runner per OS/object
      # format. The architecture siblings use the same source and linker family;
      # doubling those as well would buy little for three more full builds.
      - name: Record unsigned artifact hashes
        shell: bash
        run: |
          bun scripts/compare-release-builds.mjs --hash \
            "target/release" "${{ matrix.library }}" "${{ matrix.executable }}"

      - name: Verify unsigned reproducibility
        if: matrix.reproducible
        shell: bash
        run: |
          second_source="$RUNNER_TEMP/blitsen-repro-source"
          first_source="$RUNNER_TEMP/blitsen-repro-first-source"
          second_target="$RUNNER_TEMP/blitsen-repro-target"
          mv "$second_source" "$first_source"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$second_source"
          git -C "$second_source" checkout --quiet --detach "$GITHUB_SHA"
          (
            cd "$second_source"
            unset RUSTC_WRAPPER
            CARGO_TARGET_DIR="$second_target" \
              bash scripts/build-release-runtime.sh "${{ matrix.target }}"
          )
          bun scripts/compare-release-builds.mjs --compare \
            "target/release" "$second_target/release" \
            "${{ matrix.library }}" "${{ matrix.executable }}"

      # Ubuntu 22.04 is the oldest hosted image available for both Linux
      # architectures and therefore the binary compatibility floor. Building
      # there is necessary but this gate makes the contract explicit: a future
      # toolchain must not quietly pull either shipped artifact past glibc 2.35.
      - name: Check the glibc compatibility floor
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          ceiling=2.35
          overall=0
          for artifact in blitsen.node "${{ matrix.executable }}"; do
            path="packages/platforms/${{ matrix.target }}/$artifact"
            versions=$(readelf --version-info "$path" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
              | sed 's/^GLIBC_//' \
              | sort -Vu) || true
            maximum=$(printf '%s\n' "$versions" | sed '/^$/d' | tail -1)
            if [ -z "$maximum" ]; then
              echo "::error::$artifact exposes no readable GLIBC version requirements"
              exit 1
            fi
            echo "$artifact requires at most GLIBC_$maximum"
            overall=$(printf '%s\n' "$overall" "$maximum" | sort -V | tail -1)
          done
          echo "Maximum required GLIBC version: $overall (ceiling $ceiling)"
          echo "Maximum required GLIBC version: \`$overall\` (ceiling \`$ceiling\`)" \
            >> "$GITHUB_STEP_SUMMARY"
          newest=$(printf '%s\n' "$ceiling" "$overall" | sort -V | tail -1)
          if [ "$newest" != "$ceiling" ]; then
            echo "::error::${{ matrix.target }} requires GLIBC_$overall, above the GLIBC_$ceiling release ceiling"
            exit 1
          fi

      # `+crt-static` is the intent; the PE import table is the shipped fact.
      # Check both binaries so an addon that loads and an executable that starts
      # cannot disagree about whether a clean Windows host needs a VC redist.
      - name: Check the Windows runtime is self-contained
        if: startsWith(matrix.target, 'win32-')
        shell: pwsh
        run: |
          $failed = $false
          $readobj = (Get-Command llvm-readobj -ErrorAction Stop).Source
          foreach ($artifact in @("blitsen.node", "${{ matrix.executable }}")) {
            $path = "packages/platforms/${{ matrix.target }}/$artifact"
            $imports = (& $readobj --coff-imports $path | Out-String)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "llvm-readobj could not inspect $artifact"
              exit 1
            }
            $dynamicCrt = [regex]::Matches(
              $imports,
              '(?im)^\s*(?:Name|DLLName):\s*((?:VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*)'
            ) | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            if ($dynamicCrt.Count -gt 0) {
              Write-Error "$artifact still imports a dynamic Microsoft CRT: $($dynamicCrt -join ', ')"
              $failed = $true
            } else {
              Write-Host "$artifact has no dynamic Microsoft CRT imports"
            }
          }
          if ($failed) { exit 1 }

      # Issue #121: the third-party notices an export embeds, generated from the
      # dependency graph this job just built and audited for this target. One
      # manifest per platform package; the build fails here rather than shipping
      # an artifact whose terms cannot be honoured.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --target ${{ matrix.target }}

      # Both are native code Blitsen ships, so both get signed — and the Phase 2
      # executable is the one a user's machine launches by name, which is
      # exactly what an OS gatekeeper checks. Both steps are no-ops without
      # their secret, and say so.
      - name: Sign (macOS)
        if: startsWith(matrix.runner, 'macos')
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::APPLE_CERTIFICATE_P12/APPLE_SIGNING_IDENTITY absent — shipping an unsigned ${{ matrix.target }} runtime"
            # A skip warning is not evidence that the step below works, and the
            # step below is the one nothing has ever run (#132). What can be
            # checked without a certificate is that `codesign` accepts artifacts
            # of this shape at all: ad-hoc, on copies in the runner's temp
            # directory, so nothing that ships carries a signature this release
            # did not intend. What stays unexercised is the keychain import,
            # which needs a real `.p12`.
            for artifact in blitsen.node "${{ matrix.executable }}"; do
              probe="$RUNNER_TEMP/unsigned-probe-$artifact"
              cp "packages/platforms/${{ matrix.target }}/$artifact" "$probe"
              codesign --force --options runtime --sign - "$probe"
              codesign --verify --strict --verbose=2 "$probe"
              rm -f "$probe"
            done
            echo "::notice::codesign accepts this target's artifacts ad-hoc; only the keychain import is untested"
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain
          for artifact in blitsen.node "${{ matrix.executable }}"; do
            codesign --force --timestamp --options runtime \
              --sign "$IDENTITY" "packages/platforms/${{ matrix.target }}/$artifact"
            codesign --verify --strict --verbose=2 "packages/platforms/${{ matrix.target }}/$artifact"
          done
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$keychain"

      - name: Sign (Windows)
        if: startsWith(matrix.runner, 'windows')
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Located before the secret check, not after it, so a run without a
          # certificate still proves the path assumption this step is built on
          # (#132, #134). Finding the tool is the half that can be tested for
          # free; what stays untested is `sign` itself.
          # The SDK's own architecture, not the target's: `signtool.exe` has to
          # run on this runner, and the arm64 image carries an arm64 build. The
          # x64 one is kept as a fallback because it runs under emulation there,
          # and both Program Files roots are searched because the SDK is not
          # always installed under the x86 one. An empty result used to reach
          # `"" sign ...` and fail as `command not found`, which names nothing.
          case "${RUNNER_ARCH:-X64}" in ARM64) architectures="arm64 x64";; *) architectures="x64";; esac
          signtool=""
          for architecture in $architectures; do
            for root in "/c/Program Files (x86)/Windows Kits" "/c/Program Files/Windows Kits"; do
              [ -d "$root" ] || continue
              found=$(find "$root" -name signtool.exe -path "*/$architecture/*" | sort | tail -1)
              if [ -n "$found" ]; then signtool="$found"; break 2; fi
            done
          done
          if [ -z "$signtool" ]; then
            echo "::error::no signtool.exe for $architectures under Windows Kits on ${{ matrix.runner }}"
            exit 1
          fi
          echo "Found $signtool"
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::WINDOWS_CERTIFICATE_PFX absent — shipping an unsigned ${{ matrix.target }} runtime"
            exit 0
          fi
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"
          echo "Signing with $signtool"
          for artifact in blitsen.node "${{ matrix.executable }}"; do
            "$signtool" sign -f "$RUNNER_TEMP/certificate.pfx" -p "$CERTIFICATE_PASSWORD" \
              -fd SHA256 -tr http://timestamp.digicert.com -td SHA256 \
              "packages/platforms/${{ matrix.target }}/$artifact"
            "$signtool" verify -pa "packages/platforms/${{ matrix.target }}/$artifact"
          done
          rm -f "$RUNNER_TEMP/certificate.pfx"

      # The runtime and the CLI are one ABI, so the package tests run against
      # the artifact this job just built rather than against a stale one.
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen
        env:
          BLITSEN_NATIVE_PATH: ${{ github.workspace }}/packages/platforms/${{ matrix.target }}/blitsen.node
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/packages/platforms/${{ matrix.target }}/${{ matrix.executable }}

      - name: Pack
        shell: bash
        run: npm pack --pack-destination "$RUNNER_TEMP" "./packages/platforms/${{ matrix.target }}"

      # The notices travel with the binaries, because the publish job is a fresh
      # checkout and `NOTICES.txt`/`NOTICES.json` are generated, not committed
      # (.gitignore). Uploading only the two binaries published six packages
      # whose manifests declare notices they do not carry — and `blitsen build`
      # reads `NOTICES.txt` from beside the installed runtime, so every export a
      # user made would have silently shipped none (#121).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.target }}
          path: |
            packages/platforms/${{ matrix.target }}/blitsen.node
            packages/platforms/${{ matrix.target }}/${{ matrix.executable }}
            packages/platforms/${{ matrix.target }}/NOTICES.txt
            packages/platforms/${{ matrix.target }}/NOTICES.json
          if-no-files-found: error
          retention-days: 7

      # Open question 11: what the six-runner matrix actually costs, recorded
      # per target so the cross-compilation question can be argued from numbers.
      - name: Record cost
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.started.outputs.at }} ))
          # A job summary is per job, so each carries its own header rather than
          # rows that would render as loose text on their own.
          {
            echo "| Target | Runner | Wall clock |"
            echo "| --- | --- | --- |"
            echo "| \`${{ matrix.target }}\` | \`${{ matrix.runner }}\` | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing is one job, after every target has built, because the six
  # platform packages and `blitsen` are one release: `blitsen`'s
  # optionalDependencies name exact versions, so a half-published set resolves
  # to nothing installable. npm has no transaction, so the ordering is the
  # guarantee — every platform package first, `blitsen` last, and its own
  # publish is what makes the release visible to a user at all.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the tag and the release page, written after a publish
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/runtimes

      - name: Stage every runtime into its package
        shell: bash
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            case "$target" in win32-*) executable=blitsen-runtime.exe;; *) executable=blitsen-runtime;; esac
            # Every file the manifest's `files` array names: the two binaries and
            # the notices its build job generated for this target. A missing one
            # is an error here rather than a package that installs and then
            # fails at whichever half it lacks — or, for the notices, publishes
            # quietly incomplete, which is worse because nothing then fails.
            for artifact in blitsen.node "$executable" NOTICES.txt NOTICES.json; do
              source="$RUNNER_TEMP/runtimes/runtime-$target/$artifact"
              test -f "$source" || { echo "::error::missing $artifact for $target"; exit 1; }
              cp "$source" "packages/platforms/$target/$artifact"
            done
            # A GitHub artifact is a zip and the download does not restore the
            # executable bit, so the runtime arrives here as 0644 no matter what
            # mode the build job left it in. npm packs the mode it finds, so
            # without this every non-Windows user installs a runtime their
            # machine refuses to launch.
            case "$target" in win32-*) ;; *) chmod +x "packages/platforms/$target/$executable";; esac
          done

      # The version pin is the release's integrity: every platform package must
      # be exactly `blitsen`'s version, and `blitsen` must ask for exactly that.
      # The package tests assert this, and it is cheap to assert again here
      # because publishing a mismatched set cannot be taken back.
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen

      # What a tarball actually contains, asked of npm rather than of the
      # directory: `files` is a filter, so a manifest can name a file that is
      # not there and pack a package that is quietly missing it. This is the
      # check that catches a staging gap, and it costs one dry pack per package.
      - name: Check what each package will contain
        shell: bash
        run: |
          contents() {
            npm pack --dry-run --json "$1" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>
                  console.log(JSON.parse(s)[0].files.map(f=>f.path).join('\n')))"
          }
          missing=0
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            case "$target" in win32-*) executable=blitsen-runtime.exe;; *) executable=blitsen-runtime;; esac
            list=$(contents "./packages/platforms/$target")
            for required in LICENSE blitsen.node "$executable" NOTICES.txt NOTICES.json; do
              printf '%s\n' "$list" | grep -qxF "$required" \
                || { echo "::error::@blitsen/$target would publish without $required"; missing=1; }
            done
          done
          list=$(contents ./packages/blitsen)
          for required in bin/blitsen.mjs index.mjs index.d.ts LICENSE README.md; do
            printf '%s\n' "$list" | grep -qxF "$required" \
              || { echo "::error::blitsen would publish without $required"; missing=1; }
          done
          exit $missing

      # Issue #131: the token has to authenticate before the first publish
      # rather than at it, because the six platform packages go out before
      # `blitsen` does and a token the registry rejects leaves a release
      # stopped halfway.
      #
      # Authentication is the part that can be settled up front, and `whoami`
      # settles it. Whether the *scope* will accept a package cannot be:
      # `npm access list packages @blitsen` reads the organisation, which is a
      # different permission from writing to the scope, and a granular token
      # scoped to publish — package `blitsen` and scope `@blitsen`, read and
      # write, no organisation access — is refused by it with a 403. A token
      # that passed that check could still fail to publish, and the one that
      # publishes fails the check, so it was answering a question nobody asked.
      # It stays as a note in the log rather than a gate.
      #
      # What protects the release is the ordering: a scope that refuses this
      # token refuses the *first* platform package, so the run stops with
      # nothing published and no version burned on `blitsen` itself.
      - name: Check the registry will take this
        if: inputs.publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          who=$(npm whoami 2>&1) || {
            echo "::error::NPM_TOKEN does not authenticate: $who"
            exit 1
          }
          echo "Publishing as $who"
          if npm access list packages @blitsen >/dev/null 2>&1; then
            echo "This token can read the @blitsen organisation."
          else
            echo "::notice::@blitsen is not readable by this token, which is expected for a token with no organisation permissions — the first platform package is what proves the scope accepts it (#131)"
          fi

      - name: Check the version is not already published
        id: release_version
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./packages/blitsen/package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "blitsen@$version" version >/dev/null 2>&1; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::blitsen@$version is already published; bump the version"
              exit 1
            fi
            echo "::notice::Dry run is rehearsing already-published blitsen@$version"
          else
            echo "Releasing $version"
          fi

      # The npm tarballs are the exact binary distribution, useful both as a
      # durable rehearsal artifact and as downloads beside the GitHub release.
      # Pack them once from the already-checked staging tree, then checksum the
      # bytes that will be uploaded rather than reconstructing them later.
      - name: Pack GitHub release assets
        shell: bash
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            npm pack --pack-destination "$assets" "./packages/platforms/$target"
          done
          npm pack --pack-destination "$assets" ./packages/blitsen
          count=$(find "$assets" -maxdepth 1 -type f -name '*.tgz' | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "::error::expected seven release tarballs, found $count"
            exit 1
          fi
          (cd "$assets" && sha256sum -- *.tgz > SHA256SUMS)

      - name: Upload GitHub release assets for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.release_version.outputs.version }}
          path: |
            ${{ runner.temp }}/release-assets/*.tgz
            ${{ runner.temp }}/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "::notice::Dry run — pass publish: true to release"
            # Provenance is an attestation signed against a real publish, so it
            # is not requested for a run that is not going to make one.
            flags="--dry-run"
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::publish: true but NPM_TOKEN is not set"
            exit 1
          else
            flags="--provenance"
          fi
          # Platform packages first: blitsen's optionalDependencies have to
          # resolve the moment it lands. Publish the tarballs attached to the
          # GitHub release, so both registries distribute byte-identical packages.
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            npm publish $flags --access public --tag "$TAG" \
              "$RUNNER_TEMP/release-assets/blitsen-$target-${{ steps.release_version.outputs.version }}.tgz"
          done
          npm publish $flags --access public --tag "$TAG" \
            "$RUNNER_TEMP/release-assets/blitsen-${{ steps.release_version.outputs.version }}.tgz"

      # The tag is written after the registry has taken all seven packages, and
      # never before. A tag pushed by hand is a claim about what was released;
      # this one is a record of it, and it cannot name a version that failed to
      # publish or point at a commit that was not the one built. That ordering
      # is also why a tag does not *trigger* this workflow: `git push --tags`
      # would make a typo irreversible, and npm has no undo past 72 hours.
      #
      # `gh release create` writes the tag and the release page in one call, at
      # the commit this run built rather than at whatever the branch has moved
      # to since.
      - name: Tag the commit and open the release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.tag }}
        run: |
          tag="v${{ steps.release_version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists — attaching this run's assets to it"
          else
            args=(--target "$GITHUB_SHA" --title "$tag")
            notes="docs/RELEASE-NOTES-${{ steps.release_version.outputs.version }}.md"
            if [ -f "$notes" ]; then
              args+=(--notes-file "$notes")
            else
              echo "::warning::no $notes, so the release page carries generated notes instead"
              args+=(--generate-notes)
            fi
            # A dist-tag other than `latest` is a release npm will not default a
            # user onto, and GitHub draws the same line with --prerelease.
            if [ "$DIST_TAG" = latest ]; then args+=(--latest); else args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" "$RUNNER_TEMP"/release-assets/*.tgz \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" --clobber
          echo "release_url=$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_ENV"

      - name: Summarise
        if: always()
        shell: bash
        env:
          DIST_TAG: ${{ inputs.tag }}
          PUBLISHED: ${{ inputs.publish }}
          RELEASE_URL: ${{ env.release_url }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: bash scripts/release-summary.sh summary
