name: Pages

# Builds the documentation site and publishes it to GitHub Pages.
#
# The site is generated from docs/*.md, so it cannot describe a version of Blitsen
# that the repository does not contain. Nothing is committed back: the build output
# is uploaded as a Pages artifact and deployed from there.
#
# Requires Settings → Pages → Source: "GitHub Actions" to be selected once.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Build the site
        env:
          # blitsen.dev serves from the root, so assets take no prefix.
          SITE_BASE: ''
          SITE_ORIGIN: https://blitsen.dev
        run: bun run site:build

      - name: Check links, anchors and rendering
        run: bun run site:check

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
