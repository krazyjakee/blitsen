name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Twelve jobs across six runner labels is enough that two runs of the same branch
# queue behind each other, and the older one is answering a question nobody is
# asking any more. Keep only the newest commit's result on every branch,
# including `main`; merge bursts otherwise spend a full matrix on stale trees.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0
  # The compiler the `msrv` job installs, which is `rust-version` in the root
  # Cargo.toml written a second time because a toolchain has to be named before
  # anything can read a manifest with it. That job asserts the two agree (#277).
  RUST_MSRV: 1.95.0
  # Primary-platform jobs restore dependency artifacts from `rust-cache`. A
  # previous read-only sccache layer recorded zero hits across more than one
  # thousand compile requests, so the target archives are the sole Rust cache.
  # Linux compile/test jobs install mold for the repository's linker wrapper;
  # measurement and release-like jobs deliberately retain their baseline linker.

jobs:
  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check workflow syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          files: .github/workflows/*.yml, .github/workflows/*.yaml
          flags: -config-file .github/actionlint.yaml
      - name: Check workflow security policy
        run: |
          bun test scripts/check-workflow-security.test.mjs scripts/release-summary.test.mjs
          bun scripts/check-workflow-security.mjs

  # Fast feedback: no native toolchain, no display.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen

  # The CLI is published for Node as well as used from Bun in this repository.
  # Pack and install it offline so both ends of engines.node exercise the exact
  # files users receive, including import.meta.dirname in runtime resolution.
  node-package:
    name: Packed CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.11.0", "node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: npm --prefix packages/blitsen run test:node

  # Issue #123: the workspace is tested on all three platforms, not just the one
  # this project is developed on. Clippy and rustfmt run once, on Linux — a lint
  # result is not per-platform — and the tests run everywhere, because behaviour
  # is (the rustfmt step was missing until #278).
  #
  # Rust DOM unit tests use a test-only QuickJS oracle. Shipping apps use Bun.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Disable the POSIX compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          # Tests run after compilation. Preserve freshly compiled dependencies
          # even when an unrelated late test leaves this seed job red.
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev xvfb mold \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libgl1-mesa-dri
      # Formatting first: it compiles nothing, so an unformatted change is
      # reported in seconds instead of after clippy has built the whole graph.
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      # Under a virtual display on Linux, so blitsen-host's surface-lifecycle
      # test executes instead of skipping itself: headless runners set no
      # DISPLAY, so no Linux runner had ever run it. The runner image ships
      # xvfb; the apt line above keeps that true. Xvfb is only a display —
      # wgpu still needs a device, so the same line installs Mesa's software
      # Vulkan (lavapipe) and EGL/GL. Without them the instance has no backend
      # at all and surface creation panics with
      # FailedToCreateSurfaceForAnyBackend (first seen in run 33440709489).
      - if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
        env:
          # Turns a broken Xvfb arrangement into a failure instead of letting
          # the surface-lifecycle test resume skipping silently.
          BLITSEN_REQUIRE_DISPLAY: "1"
      - if: runner.os != 'Linux'
        run: cargo test --workspace
      # Prime the release-profile dependencies used by acceptance and release.
      # `rust-cache` omits workspace outputs, so consumers still build and test
      # Blitsen itself while avoiding another full dependency compilation.
      - run: cargo build --release -p blitsen-node && bun scripts/build-bun-runtime.mjs

  # Issue #277: `rust-version` is a promise made to whoever builds Blitsen from
  # source. Every other Rust job in this file installs a current compiler, so
  # the declared floor is free to fall behind the locked graph (the history is
  # on the field in the root Cargo.toml). This job builds the workspace with
  # exactly the declared minimum, which is the only way that number stops being
  # a guess.
  #
  # One job rather than a fourth column of the matrix above. A locked metadata
  # check compares every resolved package's declared minimum, including packages
  # behind non-Linux target predicates, with our floor. The compile that follows
  # then proves the active Linux graph with that exact compiler; the current
  # matrix separately compiles the platform-specific graphs on all three hosts.
  #
  # `cargo check` and not `cargo test`: what the floor decides is whether the
  # graph compiles at all. Behaviour on the current compiler is the matrix's
  # question and it is already asked on three platforms.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before the toolchain, because it needs no toolchain and because a job
      # that spent forty minutes proving a floor the manifest stopped declaring
      # would be worse than no job at all. Both spellings of the same version
      # are accepted: rustup wants a full triple of numbers, Cargo does not.
      - name: The pinned toolchain is the declared floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          case "$RUST_MSRV" in
            "$declared"|"$declared".*) echo "floor: $declared" ;;
            *) echo "Cargo.toml declares $declared; this job installs $RUST_MSRV"
               exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own archive: artifacts built by a different compiler are of no
          # use to `cargo-native`, and sharing the key would have the two jobs
          # take turns evicting each other.
          shared-key: cargo-msrv
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # A Linux `cargo check` does not activate dependencies behind macOS or
      # Windows target predicates. Metadata contains them regardless of host,
      # so enforce their declared floors explicitly before compiling anything.
      - name: Resolved dependencies support the declared floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          cargo metadata --format-version 1 --locked \
            | node scripts/check-rust-version.mjs "$declared"
      # A workspace check compiles the same Linux graph the matrix does, down to
      # Blitz's font enumeration and the audio backend, so it wants the same
      # system libraries.
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev mold
      # `--locked`, because the floor being tested is the one the lockfile
      # describes; a resolution free to pick older dependencies would quietly
      # test a graph nobody ships. `--all-targets` so tests and benches, which
      # are also built from source by anyone running them, are held to it too.
      - run: cargo check --workspace --all-targets --locked

  # The M3 acceptance evidence, and the P5/P6 claim it stands on. Both harnesses
  # are headless: the bridge harness renders through the CPU rasterizer, and the
  # standalone check skips its frame-cadence assertion when no display is present
  # (see docs/M3.md) — which is why the Linux standalone step runs under Xvfb,
  # so a display is present and the assertion executes.
  #
  # Issue #123: this ran on ubuntu alone, so every claim about the runtime, the
  # bridge and the export was a Linux claim wearing a cross-platform label. It
  # now runs on all three. `fail-fast: false` keeps the Linux result readable
  # while the other two settle — expect their first runs to surface toolchain
  # work rather than product failures.
  acceptance:
    name: Native acceptance (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable the POSIX compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev xvfb mold \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libgl1-mesa-dri
      - run: bun install --frozen-lockfile
      # Issue #90: one project, both runtimes, and the only difference allowed
      # is size. The engine is inside the runtime, so nothing is installed for it.
      #
      # First, because a standalone export links this and `test:standalone` will
      # not invent one. It was built after that step until the job first ran: a
      # checkout that had already built a runtime passed locally, and a clean
      # runner is the only place the order was ever load-bearing.
      - run: cargo build --release -p blitsen-node && bun scripts/build-bun-runtime.mjs
      # Issue #311: both bundle writers must rewrite the same synthetic Mach-O
      # to identical bytes. The ordinary Rust and JavaScript jobs each install
      # only one toolchain; this job has both, so it owns the language boundary.
      - name: Mach-O bundle writer conformance
        if: runner.os == 'Linux'
        run: bun packages/blitsen/test/run-bundle-writer-conformance.mjs
      # Issue #121: an export embeds the notices staged beside the runtime it
      # links, and refuses to claim redistribution when they are absent. The
      # release job stages them right after the same build; CI never did, so
      # `test:hosts` built a Bun export that correctly reported itself
      # uncleared and then failed the assertion that it should not be.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-node --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:native
      - run: bun run --cwd packages/blitsen test:ui
      - run: bun run --cwd packages/blitsen test:bun-services
      - run: bun run --cwd packages/blitsen test:m2
      # Under Xvfb on Linux, so the frame-cadence assertion (gated on DISPLAY)
      # executes instead of skipping — see the header comment above.
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd packages/blitsen test:standalone
        env:
          # The device behind Xvfb is Mesa's lavapipe, so the frame-cadence
          # assertion holds the software floor rather than the 60 Hz budget.
          BLITSEN_TEST_SOFTWARE_GPU: "1"
      - if: runner.os != 'Linux'
        run: bun run --cwd packages/blitsen test:standalone
      - run: bun run --cwd packages/blitsen test:m3b
      - run: bun run --cwd packages/blitsen test:hosts
      # Issue #121: the notices an export owes travel inside it, and the gate
      # reads them back out of a real artifact — before and after signing.
      # The CLI under Node, which is what `npx blitsen` and every script line
      # start. Every gate in this repository runs under Bun, so `Bun` was always
      # defined and `npx blitsen build` died at step ③ for anyone who installed
      # the package instead of cloning it (#131). One real export, run.
      - name: Build and run an export under Node
        shell: bash
        run: |
          node packages/blitsen/bin/blitsen.mjs build examples/pong \
            --out "$RUNNER_TEMP/NodeBuilt" --force
          BLITSEN_STANDALONE_CHECK=1 "$RUNNER_TEMP/NodeBuilt"
      - run: bun run --cwd packages/blitsen test:licensing
      # Issue #67: the other way to run an application — served by a dev server
      # rather than read off disk. The fixture server runs inside the gate.
      - run: bun run --cwd packages/blitsen test:proxy
      # Issue #253: whether macOS will talk to a process at all is decided by the
      # bundle identity that process was launched with, so it can only be gated
      # by launching them — a development host, the bundle `--dev-bundle` builds
      # for it, and an exported `.app`. Nothing here waits for a person to accept
      # a notification; the runner has none.
      - name: macOS notification identity
        if: runner.os == 'macOS'
        run: bun run --cwd packages/blitsen test:macos-notify

  # Frame determinism (issue #48). Replays one committed input trace twice, in
  # separate processes, and compares the digest sequences with each other and
  # with the committed golden. The DOM digest is portable and always gated; the
  # layout and pixel digests depend on installed fonts and CPU feature
  # detection, so they are gated only when this runner's rendering fingerprint
  # matches the golden's — see docs/M3.md. Diverging frames are uploaded as PNGs.
  determinism:
    name: Frame determinism (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev mold
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/blitsen test:determinism
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: determinism-divergence-${{ github.sha }}
          path: ${{ github.workspace }}/target/determinism-divergence
          if-no-files-found: ignore
      - name: Frame cost
        run: bun run --cwd packages/blitsen frames --out ${{ github.workspace }}/frame-metrics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frame-metrics-${{ github.sha }}
          path: ${{ github.workspace }}/frame-metrics.json

  # P6: byte-identical layout across platforms for the test corpus. This is the
  # cheapest cross-platform job in the file — it deliberately builds only
  # `blitsen-blitz`, which needs no JavaScript engine — and it is *not* the whole
  # of P6 on its own: the acceptance job above is what exercises the renderer
  # with a runtime behind it on the same three platforms (#123).
  conformance:
    name: Layout conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable the POSIX compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      # The corpus renders through the CPU rasterizer and needs no display; only
      # Blitz's font enumeration wants a system library, and only on Linux.
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev mold
      # Uncaptured, because the run reports which tier it gated and a silent
      # pass on a runner whose rasterizer differs would read like a full one.
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore

  # Product requirements P1 (size), P2 (cold start) and P3 (idle RAM). One export
  # build feeds both consumers: the size gate fails on regression, the benchmarks
  # only record and report, because a hosted runner's timings are too noisy to
  # gate on. Everything here is headless, so P2 and P3 are measured through the
  # proxies documented in docs/M3.md.
  #
  # Issue #123: measured per target, because P1 is one budget and six platforms.
  # Only the platform with a committed baseline is gated on growth — the size
  # gate says so itself for the others, and reports rather than failing.
  metrics:
    name: Size gate and benchmarks (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable the POSIX compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Pinned rather than floating: a compiler upgrade moves the native addon's
      # size and would trip the size gate as though Blitsen had regressed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Metrics uses a different compiler and has no same-run consumer.
          # Keep its small registry cache, not another three target archives.
          shared-key: cargo-metrics-registry
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # Before the measurement, not after it: what an export links is the Bun
      # interpreter, and `measure` refuses to guess at one. This built after the
      # steps that need it until the job first ran and said so (#123).
      - run: cargo build --release -p blitsen-node && bun scripts/build-bun-runtime.mjs
      - name: Measure the export
        run: bun run --cwd packages/blitsen measure --runs 5 --out ${{ github.workspace }}/measurements.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ runner.os == 'Windows' && 'blitsen-runtime.exe' || 'blitsen-runtime' }}
      - name: Size gate
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Startup and idle RAM
        run: bun run --cwd packages/blitsen bench --measurements ${{ github.workspace }}/measurements.json
      # Issue #89: recorded, never gated. The Bun runtime component breakdown moves
      # with the dependency tree, and a gate on it would fail for reasons that
      # are not regressions. The runtime it reads was built above.
      - name: Bun runtime size breakdown
        run: bun run --cwd packages/blitsen size:runtime --out ${{ github.workspace }}/runtime-size.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ runner.os == 'Windows' && 'blitsen-runtime.exe' || 'blitsen-runtime' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-size-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/runtime-size.json
      # Same document and same runner as the Bun number above. Electron's
      # complete packaged directory and Tauri's runnable release executable are
      # measured rather than copied from either project's marketing page.
      - name: Install pinned Electron and Tauri comparison tools
        run: npm ci --prefix packages/blitsen/test/fixtures/size-comparison
      - name: Measure equivalent bare Electron and Tauri applications
        run: >-
          bun run --cwd packages/blitsen size:compare --blitsen
          ${{ github.workspace }}/runtime-size.json --out
          ${{ github.workspace }}/desktop-size-comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-size-comparison-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/desktop-size-comparison.json
          if-no-files-found: ignore
      # The committed time series only grows from local runs: CI cannot push, so
      # it keeps its own per-commit copy here instead.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metrics-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #133: the release publishes six targets and every job above covers
  # three of them. These are the other three — the second architecture of a
  # platform already tested, plus x86-64 macOS, which is a different runner
  # image entirely. Without this job a `linux-arm64` runtime reaches users
  # having never had a Blitsen window opened on it.
  #
  # It is a smoke tier rather than a sixth full matrix, and the split is not
  # arbitrary. What changes with the architecture is codegen, the rasterizer's
  # CPU feature detection and whether an export links at all, so this job builds
  # exactly what the release publishes and then exercises those three things:
  # the package tests against the freshly built addon, the native acceptance
  # harness (a real frame, headless), a standalone export it runs, and the
  # layout corpus. What does *not* change with the architecture is product
  # behaviour — m2, m3b, host conformance, licensing and the proxy stay on the
  # three primary targets, where they already run on all three platforms.
  #
  # The size measurement is report-only by construction: `size:gate` says so
  # itself for a platform with no committed baseline, and the measurement is
  # uploaded so a baseline can be recorded per target from a real number rather
  # than guessed (#123).
  #
  # The three labels are overridable by the same repository variables release.yml
  # uses, so both files move together: the arm64 pair if this repository ever
  # goes private again, and the Intel macOS one whenever that image moves.
  architectures:
    name: ${{ matrix.target }} (smoke)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            library: libblitsen_node.so
            executable: blitsen-runtime
          - target: darwin-x64
            runner: ${{ vars.DARWIN_X64_RUNNER || 'macos-15-intel' }}
            library: libblitsen_node.dylib
            executable: blitsen-runtime
          - target: win32-arm64
            runner: ${{ vars.WIN32_ARM64_RUNNER || 'windows-11-arm' }}
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable the POSIX compiler wrapper on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Six full target archives do not fit GitHub's repository cache
          # quota. Preserve Cargo downloads for secondary architectures, plus
          # the target tree for Intel macOS: its cold smoke path is more than
          # twice as long as the other secondary runners.
          shared-key: cargo-architecture-registry
          cache-targets: ${{ matrix.target == 'darwin-x64' }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      # The same two artifacts release.yml builds and publishes for this target,
      # in one build, so the rest of the job runs against what a user would get.
      - name: Build the runtime
        run: cargo build --release -p blitsen-node && bun scripts/build-bun-runtime.mjs
      # Issue #229: Intel macOS selects the CPU rasterizer before a surface is
      # created. Exercise the real window/surface lifecycle on that runner
      # before JavaScript setup, so a package-lock failure cannot hide the
      # safety fallback's own result.
      - name: Test the Intel macOS CPU window fallback
        if: matrix.target == 'darwin-x64'
        run: cargo test -p blitsen-host
      - run: bun install --frozen-lockfile
      - name: Package tests against this target's artifacts
        run: bun test packages/blitsen
        env:
          BLITSEN_NATIVE_PATH: ${{ github.workspace }}/target/release/${{ matrix.library }}
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - run: bun run --cwd packages/blitsen test:native
      # The generator resolves the dependency graph for this target, and it had
      # only ever run on Linux x86-64 (#134). An export links the runtime, so
      # the notices go beside it, exactly as the release job stages them.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-node --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:standalone
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore
      - name: Measure the export (report only)
        run: bun run --cwd packages/blitsen measure --runs 3 --out ${{ github.workspace }}/measurements.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - name: Size report
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Bun runtime size breakdown (report only)
        run: bun run --cwd packages/blitsen size:runtime --out ${{ github.workspace }}/runtime-size.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-size-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/runtime-size.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metrics-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #149: the seventh target, and the first that is not a row in the
  # release matrix at all (P5c). It gets a smoke tier, and the split follows
  # #133's precedent rather than inventing a new one — build exactly what the
  # target's artifact is, then exercise the things that change with the target
  # and nothing that does not.
  #
