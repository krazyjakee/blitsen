name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nine jobs across six runner labels is enough that two runs of the same branch
# queue behind each other, and the older one is answering a question nobody is
# asking any more. Superseded runs are cancelled — except on `main`, where every
# commit's result is the record of that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: no native toolchain, no display.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen

  # Issue #123: the workspace is tested on all three platforms, not just the one
  # this project is developed on. Clippy and rustfmt run once — a lint result is
  # not per-platform — and the tests run everywhere, because behaviour is.
  #
  # The JavaScriptCore library is a Linux-only extra: it is the engine behind the
  # `javascriptcore` feature, which nothing ships (the runtime links QuickJS-ng
  # statically) and which the conformance suite keeps alive as the second engine
  # a regression can be bisected across. `BLITSEN_REQUIRE_JSC` makes its absence
  # a failure rather than a skip, so that claim stays measured where it is made.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          BLITSEN_REQUIRE_JSC: ${{ runner.os == 'Linux' && '1' || '' }}

  # The M3 acceptance evidence, and the P5/P6 claim it stands on. Both harnesses
  # are headless: the bridge harness renders through the CPU rasterizer, and the
  # standalone check skips its frame-cadence assertion when no display is present
  # (see docs/M3.md).
  #
  # Issue #123: this ran on ubuntu alone, so every claim about the runtime, the
  # bridge and the export was a Linux claim wearing a cross-platform label. It
  # now runs on all three. `fail-fast: false` keeps the Linux result readable
  # while the other two settle — expect their first runs to surface toolchain
  # work rather than product failures.
  acceptance:
    name: Native acceptance (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      # Issue #90: one project, both runtimes, and the only difference allowed
      # is size. The engine is inside the runtime, so nothing is installed for it.
      #
      # First, because a standalone export links this and `test:standalone` will
      # not invent one. It was built after that step until the job first ran: a
      # checkout that had already built a runtime passed locally, and a clean
      # runner is the only place the order was ever load-bearing.
      - run: cargo build --release -p blitsen-runtime
      # Issue #121: an export embeds the notices staged beside the runtime it
      # links, and refuses to claim redistribution when they are absent. The
      # release job stages them right after the same build; CI never did, so
      # `test:hosts` built a Phase 2 export that correctly reported itself
      # uncleared and then failed the assertion that it should not be.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:native
      - run: bun run --cwd packages/blitsen test:m2
      - run: bun run --cwd packages/blitsen test:standalone
      - run: bun run --cwd packages/blitsen test:m3b
      - run: bun run --cwd packages/blitsen test:hosts
      # Issue #121: the notices an export owes travel inside it, and the gate
      # reads them back out of a real artifact — before and after signing.
      # The CLI under Node, which is what `npx blitsen` and every script line
      # start. Every gate in this repository runs under Bun, so `Bun` was always
      # defined and `npx blitsen build` died at step ③ for anyone who installed
      # the package instead of cloning it (#131). One real export, run.
      - name: Build and run an export under Node
        shell: bash
        run: |
          node packages/blitsen/bin/blitsen.mjs build examples/pong \
            --out "$RUNNER_TEMP/NodeBuilt" --force
          BLITSEN_STANDALONE_CHECK=1 "$RUNNER_TEMP/NodeBuilt"
      - run: bun run --cwd packages/blitsen test:licensing
      # Issue #67: the other way to run an application — served by a dev server
      # rather than read off disk. The fixture server runs inside the gate.
      - run: bun run --cwd packages/blitsen test:proxy

  # Frame determinism (issue #48). Replays one committed input trace twice, in
  # separate processes, and compares the digest sequences with each other and
  # with the committed golden. The DOM digest is portable and always gated; the
  # layout and pixel digests depend on installed fonts and CPU feature
  # detection, so they are gated only when this runner's rendering fingerprint
  # matches the golden's — see docs/M3.md. Diverging frames are uploaded as PNGs.
  determinism:
    name: Frame determinism (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/blitsen test:determinism
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: determinism-divergence-${{ github.sha }}
          path: ${{ github.workspace }}/target/determinism-divergence
          if-no-files-found: ignore
      - name: Frame cost
        run: bun run --cwd packages/blitsen frames --out ${{ github.workspace }}/frame-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-metrics-${{ github.sha }}
          path: ${{ github.workspace }}/frame-metrics.json

  # P6: byte-identical layout across platforms for the test corpus. This is the
  # cheapest cross-platform job in the file — it deliberately builds only
  # `blitsen-blitz`, which needs no JavaScript engine — and it is *not* the whole
  # of P6 on its own: the acceptance job above is what exercises the renderer
  # with a runtime behind it on the same three platforms (#123).
  conformance:
    name: Layout conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The corpus renders through the CPU rasterizer and needs no display; only
      # Blitz's font enumeration wants a system library, and only on Linux.
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      # Uncaptured, because the run reports which tier it gated and a silent
      # pass on a runner whose rasterizer differs would read like a full one.
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore

  # Product requirements P1 (size), P2 (cold start) and P3 (idle RAM). One export
  # build feeds both consumers: the size gate fails on regression, the benchmarks
  # only record and report, because a hosted runner's timings are too noisy to
  # gate on. Everything here is headless, so P2 and P3 are measured through the
  # proxies documented in docs/M3.md.
  #
  # Issue #123: measured per target, because P1 is one budget and six platforms.
  # Only the platform with a committed baseline is gated on growth — the size
  # gate says so itself for the others, and reports rather than failing.
  metrics:
    name: Size gate and benchmarks (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Pinned rather than floating: a compiler upgrade moves the native addon's
      # size and would trip the size gate as though Blitsen had regressed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      # Before the measurement, not after it: what an export links is the Phase 2
      # runtime, and `measure` refuses to guess at one. This built after the
      # steps that need it until the job first ran and said so (#123).
      - run: cargo build --release -p blitsen-runtime
      - name: Measure the export
        run: bun run --cwd packages/blitsen measure --runs 5 --out ${{ github.workspace }}/measurements.json
      - name: Size gate
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Startup and idle RAM
        run: bun run --cwd packages/blitsen bench --measurements ${{ github.workspace }}/measurements.json
      # Issue #89: recorded, never gated. The Phase 2 component breakdown moves
      # with the dependency tree, and a gate on it would fail for reasons that
      # are not regressions. The runtime it reads was built above.
      - name: Phase 2 size breakdown
        run: bun run --cwd packages/blitsen size:phase2 --out ${{ github.workspace }}/phase2-size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-size-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/phase2-size.json
      # The committed time series only grows from local runs: CI cannot push, so
      # it keeps its own per-commit copy here instead.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #133: the release publishes six targets and every job above covers
  # three of them. These are the other three — the second architecture of a
  # platform already tested, plus x86-64 macOS, which is a different runner
  # image entirely. Without this job a `linux-arm64` runtime reaches users
  # having never had a Blitsen window opened on it.
  #
  # It is a smoke tier rather than a sixth full matrix, and the split is not
  # arbitrary. What changes with the architecture is codegen, the rasterizer's
  # CPU feature detection and whether an export links at all, so this job builds
  # exactly what the release publishes and then exercises those three things:
  # the package tests against the freshly built addon, the native acceptance
  # harness (a real frame, headless), a standalone export it runs, and the
  # layout corpus. What does *not* change with the architecture is product
  # behaviour — m2, m3b, host conformance, licensing and the proxy stay on the
  # three primary targets, where they already run on all three platforms.
  #
  # The size measurement is report-only by construction: `size:gate` says so
  # itself for a platform with no committed baseline, and the measurement is
  # uploaded so a baseline can be recorded per target from a real number rather
  # than guessed (#123).
  #
  # The three labels are overridable by the same repository variables release.yml
  # uses, so both files move together: the arm64 pair if this repository ever
  # goes private again, and the Intel macOS one whenever that image moves.
  architectures:
    name: ${{ matrix.target }} (smoke)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            library: libblitsen_node.so
            executable: blitsen-runtime
          - target: darwin-x64
            runner: ${{ vars.DARWIN_X64_RUNNER || 'macos-15-intel' }}
            library: libblitsen_node.dylib
            executable: blitsen-runtime
          - target: win32-arm64
            runner: ${{ vars.WIN32_ARM64_RUNNER || 'windows-11-arm' }}
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      # The same two artifacts release.yml builds and publishes for this target,
      # in one build, so the rest of the job runs against what a user would get.
      - name: Build the runtime
        run: cargo build --release -p blitsen-node -p blitsen-runtime
      - run: bun install --frozen-lockfile
      - name: Package tests against this target's artifacts
        run: bun test packages/blitsen
        env:
          BLITSEN_NATIVE_PATH: ${{ github.workspace }}/target/release/${{ matrix.library }}
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - run: bun run --cwd packages/blitsen test:native
      # The generator resolves the dependency graph for this target, and it had
      # only ever run on Linux x86-64 (#134). An export links the runtime, so
      # the notices go beside it, exactly as the release job stages them.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:standalone
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore
      - name: Measure the export (report only)
        run: bun run --cwd packages/blitsen measure --runs 3 --out ${{ github.workspace }}/measurements.json
      - name: Size report
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json
