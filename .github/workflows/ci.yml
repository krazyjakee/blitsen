name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Twelve jobs across six runner labels is enough that two runs of the same branch
# queue behind each other, and the older one is answering a question nobody is
# asking any more. Superseded runs are cancelled — except on `main`, where every
# commit's result is the record of that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0
  # The compiler the `msrv` job installs, which is `rust-version` in the root
  # Cargo.toml written a second time because a toolchain has to be named before
  # anything can read a manifest with it. That job asserts the two agree (#277).
  RUST_MSRV: 1.95.0
  # Primary-platform jobs restore dependency artifacts from `rust-cache`.
  # sccache remains read-only: its per-object writes created thousands of cache
  # entries, exhausted the repository quota and were routinely rate-limited.
  # One target archive per primary OS is both smaller and cheaper to restore.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

jobs:
  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check workflow syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          files: .github/workflows/*.yml, .github/workflows/*.yaml
          flags: -config-file .github/actionlint.yaml
      - name: Check workflow security policy
        run: |
          bun test scripts/check-workflow-security.test.mjs scripts/release-summary.test.mjs
          bun scripts/check-workflow-security.mjs

  # Fast feedback: no native toolchain, no display.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen

  # The CLI is published for Node as well as used from Bun in this repository.
  # Pack and install it offline so both ends of engines.node exercise the exact
  # files users receive, including import.meta.dirname in runtime resolution.
  node-package:
    name: Packed CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.11.0", "node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm --prefix packages/blitsen run test:node

  # Issue #123: the workspace is tested on all three platforms, not just the one
  # this project is developed on. Clippy and rustfmt run once, on Linux — a lint
  # result is not per-platform — and the tests run everywhere, because behaviour
  # is. Until #278 the rustfmt half of that sentence was an intention rather than
  # a description: the component was installed on every runner and no step ever
  # called it, so `main` accumulated formatting drift while CI reported green.
  #
  # No engine library is installed on any of them: the runtime links QuickJS-ng
  # statically, so the engine arrives with the Rust build and there is nothing
  # for a job to go and find.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      # Formatting first: it compiles nothing, so an unformatted change is
      # reported in seconds instead of after clippy has built the whole graph.
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Prime the release-profile dependencies used by acceptance and release.
      # `rust-cache` omits workspace outputs, so consumers still build and test
      # Blitsen itself while avoiding another full dependency compilation.
      - run: cargo build --release -p blitsen-node -p blitsen-runtime

  # Issue #277: `rust-version` is a promise made to whoever builds Blitsen from
  # source, and until now nothing here had ever kept it. Every other Rust job in
  # this file installs a current compiler, so the declared floor was free to fall
  # behind the locked graph — and it had, by six minor releases. This job builds
  # the workspace with exactly the declared minimum, which is the only way that
  # number stops being a guess.
  #
  # One job rather than a fourth column of the matrix above. A locked metadata
  # check compares every resolved package's declared minimum, including packages
  # behind non-Linux target predicates, with our floor. The compile that follows
  # then proves the active Linux graph with that exact compiler; the current
  # matrix separately compiles the platform-specific graphs on all three hosts.
  #
  # `cargo check` and not `cargo test`: what the floor decides is whether the
  # graph compiles at all. Behaviour on the current compiler is the matrix's
  # question and it is already asked on three platforms.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before the toolchain, because it needs no toolchain and because a job
      # that spent forty minutes proving a floor the manifest stopped declaring
      # would be worse than no job at all. Both spellings of the same version
      # are accepted: rustup wants a full triple of numbers, Cargo does not.
      - name: The pinned toolchain is the declared floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          case "$RUST_MSRV" in
            "$declared"|"$declared".*) echo "floor: $declared" ;;
            *) echo "Cargo.toml declares $declared; this job installs $RUST_MSRV"
               exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own archive: artifacts built by a different compiler are of no
          # use to `cargo-native`, and sharing the key would have the two jobs
          # take turns evicting each other.
          shared-key: cargo-msrv
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # A Linux `cargo check` does not activate dependencies behind macOS or
      # Windows target predicates. Metadata contains them regardless of host,
      # so enforce their declared floors explicitly before compiling anything.
      - name: Resolved dependencies support the declared floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          cargo metadata --format-version 1 --locked \
            | node scripts/check-rust-version.mjs "$declared"
      # A workspace check compiles the same Linux graph the matrix does, down to
      # Blitz's font enumeration and the audio backend, so it wants the same
      # system libraries.
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      # `--locked`, because the floor being tested is the one the lockfile
      # describes; a resolution free to pick older dependencies would quietly
      # test a graph nobody ships. `--all-targets` so tests and benches, which
      # are also built from source by anyone running them, are held to it too.
      - run: cargo check --workspace --all-targets --locked

  # The M3 acceptance evidence, and the P5/P6 claim it stands on. Both harnesses
  # are headless: the bridge harness renders through the CPU rasterizer, and the
  # standalone check skips its frame-cadence assertion when no display is present
  # (see docs/M3.md).
  #
  # Issue #123: this ran on ubuntu alone, so every claim about the runtime, the
  # bridge and the export was a Linux claim wearing a cross-platform label. It
  # now runs on all three. `fail-fast: false` keeps the Linux result readable
  # while the other two settle — expect their first runs to surface toolchain
  # work rather than product failures.
  acceptance:
    name: Native acceptance (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      - run: bun install --frozen-lockfile
      # Issue #90: one project, both runtimes, and the only difference allowed
      # is size. The engine is inside the runtime, so nothing is installed for it.
      #
      # First, because a standalone export links this and `test:standalone` will
      # not invent one. It was built after that step until the job first ran: a
      # checkout that had already built a runtime passed locally, and a clean
      # runner is the only place the order was ever load-bearing.
      - run: cargo build --release -p blitsen-runtime
      # Issue #311: both bundle writers must rewrite the same synthetic Mach-O
      # to identical bytes. The ordinary Rust and JavaScript jobs each install
      # only one toolchain; this job has both, so it owns the language boundary.
      - name: Mach-O bundle writer conformance
        if: runner.os == 'Linux'
        run: bun packages/blitsen/test/run-bundle-writer-conformance.mjs
      # Issue #121: an export embeds the notices staged beside the runtime it
      # links, and refuses to claim redistribution when they are absent. The
      # release job stages them right after the same build; CI never did, so
      # `test:hosts` built a Phase 2 export that correctly reported itself
      # uncleared and then failed the assertion that it should not be.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:native
      - run: bun run --cwd packages/blitsen test:m2
      - run: bun run --cwd packages/blitsen test:standalone
      - run: bun run --cwd packages/blitsen test:m3b
      - run: bun run --cwd packages/blitsen test:hosts
      # Issue #121: the notices an export owes travel inside it, and the gate
      # reads them back out of a real artifact — before and after signing.
      # The CLI under Node, which is what `npx blitsen` and every script line
      # start. Every gate in this repository runs under Bun, so `Bun` was always
      # defined and `npx blitsen build` died at step ③ for anyone who installed
      # the package instead of cloning it (#131). One real export, run.
      - name: Build and run an export under Node
        shell: bash
        run: |
          node packages/blitsen/bin/blitsen.mjs build examples/pong \
            --out "$RUNNER_TEMP/NodeBuilt" --force
          BLITSEN_STANDALONE_CHECK=1 "$RUNNER_TEMP/NodeBuilt"
      - run: bun run --cwd packages/blitsen test:licensing
      # Issue #67: the other way to run an application — served by a dev server
      # rather than read off disk. The fixture server runs inside the gate.
      - run: bun run --cwd packages/blitsen test:proxy
      # Issue #253: whether macOS will talk to a process at all is decided by the
      # bundle identity that process was launched with, so it can only be gated
      # by launching them — a development host, the bundle `--dev-bundle` builds
      # for it, and an exported `.app`. Nothing here waits for a person to accept
      # a notification; the runner has none.
      - name: macOS notification identity
        if: runner.os == 'macOS'
        run: bun run --cwd packages/blitsen test:macos-notify

  # Frame determinism (issue #48). Replays one committed input trace twice, in
  # separate processes, and compares the digest sequences with each other and
  # with the committed golden. The DOM digest is portable and always gated; the
  # layout and pixel digests depend on installed fonts and CPU feature
  # detection, so they are gated only when this runner's rendering fingerprint
  # matches the golden's — see docs/M3.md. Diverging frames are uploaded as PNGs.
  determinism:
    name: Frame determinism (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/blitsen test:determinism
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: determinism-divergence-${{ github.sha }}
          path: ${{ github.workspace }}/target/determinism-divergence
          if-no-files-found: ignore
      - name: Frame cost
        run: bun run --cwd packages/blitsen frames --out ${{ github.workspace }}/frame-metrics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frame-metrics-${{ github.sha }}
          path: ${{ github.workspace }}/frame-metrics.json

  # P6: byte-identical layout across platforms for the test corpus. This is the
  # cheapest cross-platform job in the file — it deliberately builds only
  # `blitsen-blitz`, which needs no JavaScript engine — and it is *not* the whole
  # of P6 on its own: the acceptance job above is what exercises the renderer
  # with a runtime behind it on the same three platforms (#123).
  conformance:
    name: Layout conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-native
          cache-targets: true
          cache-bin: false
          save-if: false
      # The corpus renders through the CPU rasterizer and needs no display; only
      # Blitz's font enumeration wants a system library, and only on Linux.
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      # Uncaptured, because the run reports which tier it gated and a silent
      # pass on a runner whose rasterizer differs would read like a full one.
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore

  # Product requirements P1 (size), P2 (cold start) and P3 (idle RAM). One export
  # build feeds both consumers: the size gate fails on regression, the benchmarks
  # only record and report, because a hosted runner's timings are too noisy to
  # gate on. Everything here is headless, so P2 and P3 are measured through the
  # proxies documented in docs/M3.md.
  #
  # Issue #123: measured per target, because P1 is one budget and six platforms.
  # Only the platform with a committed baseline is gated on growth — the size
  # gate says so itself for the others, and reports rather than failing.
  metrics:
    name: Size gate and benchmarks (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Pinned rather than floating: a compiler upgrade moves the native addon's
      # size and would trip the size gate as though Blitsen had regressed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Metrics uses a different compiler and has no same-run consumer.
          # Keep its small registry cache, not another three target archives.
          shared-key: cargo-metrics-registry
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # Before the measurement, not after it: what an export links is the Phase 2
      # runtime, and `measure` refuses to guess at one. This built after the
      # steps that need it until the job first ran and said so (#123).
      - run: cargo build --release -p blitsen-runtime
      - name: Measure the export
        run: bun run --cwd packages/blitsen measure --runs 5 --out ${{ github.workspace }}/measurements.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ runner.os == 'Windows' && 'blitsen-runtime.exe' || 'blitsen-runtime' }}
      - name: Size gate
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Startup and idle RAM
        run: bun run --cwd packages/blitsen bench --measurements ${{ github.workspace }}/measurements.json
      # Issue #89: recorded, never gated. The Phase 2 component breakdown moves
      # with the dependency tree, and a gate on it would fail for reasons that
      # are not regressions. The runtime it reads was built above.
      - name: Phase 2 size breakdown
        run: bun run --cwd packages/blitsen size:phase2 --out ${{ github.workspace }}/phase2-size.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ runner.os == 'Windows' && 'blitsen-runtime.exe' || 'blitsen-runtime' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: phase2-size-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/phase2-size.json
      # Same document and same runner as the Phase 2 number above. Electron's
      # complete packaged directory and Tauri's runnable release executable are
      # measured rather than copied from either project's marketing page.
      - name: Install pinned Electron and Tauri comparison tools
        run: npm ci --prefix packages/blitsen/test/fixtures/size-comparison
      - name: Measure equivalent bare Electron and Tauri applications
        run: >-
          bun run --cwd packages/blitsen size:compare --blitsen
          ${{ github.workspace }}/phase2-size.json --out
          ${{ github.workspace }}/desktop-size-comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-size-comparison-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/desktop-size-comparison.json
          if-no-files-found: ignore
      # The committed time series only grows from local runs: CI cannot push, so
      # it keeps its own per-commit copy here instead.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metrics-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #133: the release publishes six targets and every job above covers
  # three of them. These are the other three — the second architecture of a
  # platform already tested, plus x86-64 macOS, which is a different runner
  # image entirely. Without this job a `linux-arm64` runtime reaches users
  # having never had a Blitsen window opened on it.
  #
  # It is a smoke tier rather than a sixth full matrix, and the split is not
  # arbitrary. What changes with the architecture is codegen, the rasterizer's
  # CPU feature detection and whether an export links at all, so this job builds
  # exactly what the release publishes and then exercises those three things:
  # the package tests against the freshly built addon, the native acceptance
  # harness (a real frame, headless), a standalone export it runs, and the
  # layout corpus. What does *not* change with the architecture is product
  # behaviour — m2, m3b, host conformance, licensing and the proxy stay on the
  # three primary targets, where they already run on all three platforms.
  #
  # The size measurement is report-only by construction: `size:gate` says so
  # itself for a platform with no committed baseline, and the measurement is
  # uploaded so a baseline can be recorded per target from a real number rather
  # than guessed (#123).
  #
  # The three labels are overridable by the same repository variables release.yml
  # uses, so both files move together: the arm64 pair if this repository ever
  # goes private again, and the Intel macOS one whenever that image moves.
  architectures:
    name: ${{ matrix.target }} (smoke)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            library: libblitsen_node.so
            executable: blitsen-runtime
          - target: darwin-x64
            runner: ${{ vars.DARWIN_X64_RUNNER || 'macos-15-intel' }}
            library: libblitsen_node.dylib
            executable: blitsen-runtime
          - target: win32-arm64
            runner: ${{ vars.WIN32_ARM64_RUNNER || 'windows-11-arm' }}
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Six full target archives do not fit GitHub's repository cache
          # quota. Preserve Cargo downloads for secondary architectures, plus
          # the target tree for Intel macOS: its cold smoke path is more than
          # twice as long as the other secondary runners.
          shared-key: cargo-architecture-registry
          cache-targets: ${{ matrix.target == 'darwin-x64' }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev
      # The same two artifacts release.yml builds and publishes for this target,
      # in one build, so the rest of the job runs against what a user would get.
      - name: Build the runtime
        run: cargo build --release -p blitsen-node -p blitsen-runtime
      # Issue #229: Intel macOS selects the CPU rasterizer before a surface is
      # created. Exercise the real window/surface lifecycle on that runner
      # before JavaScript setup, so a package-lock failure cannot hide the
      # safety fallback's own result.
      - name: Test the Intel macOS CPU window fallback
        if: matrix.target == 'darwin-x64'
        run: cargo test -p blitsen-host
      - run: bun install --frozen-lockfile
      - name: Package tests against this target's artifacts
        run: bun test packages/blitsen
        env:
          BLITSEN_NATIVE_PATH: ${{ github.workspace }}/target/release/${{ matrix.library }}
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - run: bun run --cwd packages/blitsen test:native
      # The generator resolves the dependency graph for this target, and it had
      # only ever run on Linux x86-64 (#134). An export links the runtime, so
      # the notices go beside it, exactly as the release job stages them.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:standalone
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore
      - name: Measure the export (report only)
        run: bun run --cwd packages/blitsen measure --runs 3 --out ${{ github.workspace }}/measurements.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - name: Size report
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Phase 2 size breakdown (report only)
        run: bun run --cwd packages/blitsen size:phase2 --out ${{ github.workspace }}/phase2-size.json
        env:
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: phase2-size-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/phase2-size.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metrics-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #149: the seventh target, and the first that is not a row in the
  # release matrix at all (P5c). It gets a smoke tier, and the split follows
  # #133's precedent rather than inventing a new one — build exactly what the
  # target's artifact is, then exercise the things that change with the target
  # and nothing that does not.
  #
  # What changes on Android is the whole bottom of the graph: two cross-compiles
  # instead of a native build, QuickJS bindings generated rather than shipped,
  # OpenSSL built from source under the NDK, an audio backend that is neither
  # ALSA nor CoreAudio, and an entry point that is a `.so` the platform loads
  # rather than a program it execs. Every one of those is a thing that can break
  # without a single desktop job noticing. What does *not* change is product
  # behaviour, so m2, m3b, layout conformance, determinism and the size gate
  # stay on the targets that already run them — the same line #133 drew.
  #
  # ## The artifact, which this job now packages
  #
  # When this job was written it stopped at the cross-compile, and the reason
  # was not a decision about tiers: `blitsen build --android` could not emit an
  # APK containing Blitsen's engine at all. It generated a cdylib whose one line
  # invoked `blitsen_android::android_main!()`, a macro `blitsen-android` never
  # exported — it is itself the `cdylib`. #148 landed the opposite and #143 ran
  # the result on a device, so the CLI compiles `-p blitsen-android` directly
  # and packages it with `aapt2 link`, an archive written in process, `zipalign
  # -p` and `apksigner`. There is an artifact now, so this job builds one, and
  # it builds it by running `bin/blitsen.mjs` rather than by re-implementing the
  # steps: the point is to exercise the command a user runs.
  #
  # Three prerequisites were found by trying, and are fixed rather than
  # documented: `RANLIB_<triple>` and `BINDGEN_EXTRA_CLANG_ARGS_<triple>`, which
  # this graph needs and the packager that used to drive the compile did not set
  # (see `apkPlan`), and a `min_sdk_version` of 26, which is where the NDK first
  # ships the `libaaudio` that `cpal` links.
  #
  # ## Device evidence stays in its own tier
  #
  # It does not boot an emulator. The `android-notifications` tier below takes
  # this job's APK as an artifact and is a required check in its own right. The
  # separation keeps an AVD boot failure from masquerading as a cross-compile
  # failure while still making both failures gate the change.
  android:
    name: android (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # This job installs cargo-ndk after the cache step. Keep its bin cache
          # separate so another job cannot win the shared immutable cache first
          # and leave the tool absent on every later Android run.
          shared-key: cargo-android-registry
          # cargo-ndk and the registry are compact; two Android target trees are
          # larger than the benefit once the primary native caches are present.
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # `rquickjs-sys` ships pre-generated bindings for sixteen triples and none
      # is `*-linux-android`, so `crates/blitsen-quickjs/Cargo.toml` turns on its
      # `bindgen` feature for that target — which makes libclang a build-time
      # requirement Android alone has. The runner image's manifest lists Clang
      # 16, 17 and 18 under its tools and names no libclang package at all, so
      # this is installed rather than assumed: bindgen loads `libclang.so`, not
      # the `clang` driver, and the two are different packages.
      - name: Install libclang, which the Android QuickJS bindings need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      # No Blitz system libraries here, unlike every other Linux job in this
      # file: fontconfig, xkbcommon, wayland and X11 are the *host* platform's,
      # and nothing in an Android cross-compile links them. If a step below ever
      # starts wanting them, something has stopped being a cross-compile.
      #
      # The NDK is not installed either — the image carries one and sets
      # ANDROID_NDK_HOME to it, which is the whole of the prerequisite
      # `android-toolchain.mjs` refuses to provision. Asserted rather than
      # trusted, because an image that drops it would otherwise fail much later.
      #
      # The rest of what `android-toolchain.mjs` refuses to provision is checked
      # in the same breath, because the packaging step below runs the real
      # detector and every one of these is a failure it would report an hour
      # into the job instead of at the top of it: `aapt2`, `zipalign` and
      # `apksigner` out of build-tools, and the JDK the last two are wrappers
      # around. The API 33 platform is *not* checked here — the image does not
      # carry one and the step below installs it.
      - name: Check the Android toolchain the image carries
        run: |
          set -euo pipefail
          test -n "$ANDROID_NDK_HOME" || { echo "ANDROID_NDK_HOME is unset"; exit 1; }
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \
            || { echo "$ANDROID_NDK_HOME has no C toolchain"; exit 1; }
          grep Pkg.Revision "$ANDROID_NDK_HOME/source.properties"
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is unset"; exit 1; }
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort -V | tail -1)
          for tool in aapt2 zipalign apksigner; do
            test -x "$ANDROID_HOME/build-tools/$tools/$tool" \
              || { echo "build-tools $tools has no $tool"; exit 1; }
          done
          # apksigner and keytool are shell wrappers around a JVM, so a missing
          # `java` fails inside them with a message about neither.
          java -version
      # `cargo-ndk` is what points the cross-compile at the NDK, and it is also
      # what #142 measured the graph against, so a failure here is comparable
      # with the result that issue recorded. The CLI runs it too — this step
      # exists so that a broken graph fails before the packaging step, where the
      # same failure would be reported as a build that produced no `.so`.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Both default ABIs, in one invocation, because that is what one APK
      # carries (#148's decision 2) and because arm64 alone would leave the
      # emulator ABI unbuilt — which is precisely the one an emulator tier needs.
      - name: Cross-compile the Android entry point for both default ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 -P 26 build --release -p blitsen-android
      # The shipped build above takes Android's CPU/softbuffer path. Keep the
      # Vello/wgpu path compiling for deliberate physical-device qualification;
      # it is an opt-in experiment, not an automatic runtime fallback (#151).
      - name: The Android GPU qualification build still type-checks
        run: >-
          cargo ndk -t x86_64 -P 26 check --release -p blitsen-android
          --features android-vello-gpu
      # A `.so` that links and does not export `android_main` is a crash inside
      # `dlopen` with nothing to read, so the symbol is checked rather than
      # assumed — it is the entire contract between the platform and this crate.
      # The ELF machine is checked too: a build that silently produced two copies
      # of the same architecture would satisfy every other assertion here.
      - name: The artifacts are what Android would load
        run: |
          set -euo pipefail
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for pair in "aarch64-linux-android:AArch64" "x86_64-linux-android:X86-64"; do
            triple="${pair%%:*}"
            machine="${pair##*:}"
            so="target/$triple/release/libblitsen_android.so"
            test -f "$so" || { echo "$so was not built"; exit 1; }
            header="$("$readelf" -h "$so")"
            symbols="$("$nm" --dynamic --defined-only "$so")"
            grep -q "$machine" <<< "$header" \
              || { echo "$so is not $machine"; "$readelf" -h "$so"; exit 1; }
            grep -qw android_main <<< "$symbols" \
              || { echo "$so exports no android_main, so NativeActivity cannot start it"; exit 1; }
            echo "$so: $machine, exports android_main, $(stat -c%s "$so") bytes"
          done
      # Issue #121: an artifact carries the notices it owes, and Android has no
      # platform package to take them from — `blitsen build --android` reads
      # `BLITSEN_NOTICES_PATH` and reports the APK uncleared for redistribution
      # when it is unset. Nothing had ever resolved that graph for an Android
      # triple, and the generator exits non-zero when a package's terms cannot
      # be honoured, so this is a real gate on a real dependency set. What it
      # produces is then put in the APK below, which is the only way to find out
      # that the two halves of #121 agree on a filename.
      - run: bun install --frozen-lockfile
      - name: The notices an Android artifact owes resolve
        run: |
          bun run --cwd packages/blitsen notices --target android-arm64 \
            --root blitsen-android --out ${{ runner.temp }}/android-notices
      # The one thing the image does not carry. `aapt2 link -I` needs the
      # `android.jar` of `TARGET_SDK`, which is 33, and the runner image
      # installs platforms from 34 upwards — so this is a verified absence
      # rather than a precaution, and it is the only Android component this
      # workflow downloads. The licence is already accepted in the image, which
      # installed its own platforms with the same tool.
      - name: Install the API 33 platform aapt2 links against
        run: |
          set -euo pipefail
          sdkmanager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          test -x "$sdkmanager" || { echo "no sdkmanager at $sdkmanager"; exit 1; }
          # `< /dev/null` rather than `yes |`: the licence is already accepted,
          # so a prompt means it is not, and the answer to that is to fail in a
          # minute rather than to hang until the job's timeout.
          "$sdkmanager" --install "platforms;android-33" < /dev/null
          test -f "$ANDROID_HOME/platforms/android-33/android.jar" \
            || { echo "android-33 installed but has no android.jar"; exit 1; }
      # P5c's artifact, built by the command a user runs rather than by a
      # re-implementation of its steps. `bin/blitsen.mjs` runs the real
      # detector, the real `apkPlan` and the real archive writer, so this is the
      # first thing in CI that would notice a manifest aapt2 refuses, a build
      # tool that moved, or an entry the packager stopped storing.
      #
      # The application is `test/bare-app.mjs`, which is the same document P1
      # and P1b are measured against — one bare application across the whole
      # repository, so nothing here quietly measures a different one.
      #
      # Both default ABIs, because that is what one APK carries (#148's decision
      # 2) and the cross-compile above already built both, so the CLI's own
      # `cargo ndk` is a cache hit rather than a second build.
      - name: Package an APK with the CLI
        env:
          BLITSEN_NOTICES_PATH: ${{ runner.temp }}/android-notices/NOTICES.txt
          APP: ${{ runner.temp }}/bare-app
        run: |
          set -euo pipefail
          bun -e 'import { BARE_APP } from "./packages/blitsen/test/bare-app.mjs";
                  await Bun.write(process.env.APP + "/index.html", BARE_APP);'
          bun packages/blitsen/bin/blitsen.mjs build "$APP" \
            --android --outfile ${{ runner.temp }}/Bare.apk
      # Read back rather than trusted, for the reason the `.so` above is: the
      # build printing "packaged" proves it reached the end of its own steps and
      # nothing else. Every entry the packager writes must be stored (#144), or
      # the assets are not read in place and `extractNativeLibs="false"` is a
      # lie; META-INF is apksigner's and is deflated by the JAR signer, which is
      # why the check is on what the build wrote rather than on the whole file.
      - name: The APK is an archive Android would install
        run: |
          python3 - ${{ runner.temp }}/Bare.apk <<'PY'
          import sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          entries = {info.filename: info for info in apk.infolist()}
          for want in ("AndroidManifest.xml",
                       "lib/arm64-v8a/libblitsen_android.so",
                       "lib/x86_64/libblitsen_android.so",
                       "assets/blitsen/index.html",
                       "assets/blitsen/blitsen.assets.json",
                       "assets/blitsen/blitsen.notices.txt"):
              if want not in entries:
                  raise SystemExit(f"{want} is not in the APK: {sorted(entries)}")
              if entries[want].compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(f"{want} is deflated, which #144 forbids")
          print(f"{len(entries)} entries, {sum(i.file_size for i in entries.values())} bytes")
          PY
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$tools/apksigner" \
            verify --print-certs ${{ runner.temp }}/Bare.apk
      # Issue #254's fixture, packaged by the same command for the same reason: the
      # emulator job below has to install the artifact a user would get, manifest and
      # all, or the `POST_NOTIFICATIONS` it asserts on is not the one the packager
      # writes. It is a second application rather than the bare one because the bare
      # one calls nothing — this document drives `blitsen/notify` and reports what it
      # observed back through the notification shade, which `android-notify-app.mjs`
      # records is the only channel out of an APK.
      #
      # A second `blitsen build` and not a second compile: `cargo ndk` has already
      # built both ABIs above, so this is `aapt2 link`, the archive writer and
      # `apksigner`. The application ID is given rather than derived, because the
      # harness has to be told which package to install, clear and grant.
      - name: Package the notification fixture the emulator job installs
        env:
          BLITSEN_NOTICES_PATH: ${{ runner.temp }}/android-notices/NOTICES.txt
          APP: ${{ runner.temp }}/notify-app
        run: |
          set -euo pipefail
          bun -e 'import { NOTIFY_APP } from "./packages/blitsen/test/android-notify-app.mjs";
                  await Bun.write(process.env.APP + "/index.html", NOTIFY_APP);'
          bun packages/blitsen/bin/blitsen.mjs build "$APP" \
            --android --android-package com.blitsen.notifyfixture \
            --outfile ${{ runner.temp }}/Notify.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-notify-apk-${{ github.sha }}
          path: ${{ runner.temp }}/Notify.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-notices-${{ github.sha }}
          path: ${{ runner.temp }}/android-notices
          if-no-files-found: ignore

  # Issue #254: the first Blitsen artifact this repository has ever run on an
  # Android device in CI, and it runs it for the one native API whose behaviour is
  # a system service rather than a pixel.
  #
  # ## Why this is a separate job
  #
  # #245 landed Android notifications against a checkout with no emulator, so the
  # evidence for them was that the JNI signatures type-check and the manifest
  # contains a permission string. Neither can say what `checkSelfPermission`
  # returns, whether `blitsen.default` is the channel the shade files a
  # notification under, or whether `notify` with a reused ID replaces rather than
  # adds. That needs a device, a device needs a boot, and a boot is the flakiest
  # thing in this file — so it is quarantined here, where a failure is read as
  # "the notification tier" and not as "the Android cross-compile broke".
  #
  # `needs: android` for the APK rather than for the gate: the artifact this
  # installs is the one the job above packaged with the CLI, which is the whole
  # point of asserting against it. Building a second one here would be a second
  # cross-compile of the engine for a fixture that differs from the first by one
  # HTML file.
  #
  # ## The matrix is the API 33 split and nothing else
  #
  # 32 and 33 are not two versions of one test. Below 33, `POST_NOTIFICATIONS` is
  # not a runtime permission and the host reports `granted` without asking the
  # platform anything, so what 32 proves is that delivery works with no prompt
  # anywhere in it. At 33 the whole permission state machine exists, and the
  # harness runs three launches over one install: deny at the dialog, relaunch to
  # read the denial back out of the SharedPreferences #245 writes, then a clean
  # install granted at the dialog. Both use `google_apis`, which is the only
  # published system image for 32 and the rootable one for 33.
  #
  # ## What is recorded, because an emulator failure is only ever read afterwards
  #
  # The harness writes a logcat, the raw `dumpsys notification` it asserted
  # against, the `dumpsys package` permission state, the timeline of shade readings
  # it polled, and the `uiautomator` hierarchy of any screen it could not find the
  # dialog on. All of it is uploaded on failure *and* on success, because a run
  # that passes for the wrong reason is diagnosed from the same files.
  #
  # Android's default CPU renderer does not create a wgpu device, so the API
  # 32/33 lavapipe adapter's zero storage-buffer limit no longer prevents the
  # fixture reaching application code (#151). This is consequently a required
  # check: a boot, launch, renderer or notification failure fails the workflow.
  android-notifications:
    name: android (notifications, API ${{ matrix.api-level }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [32, 33]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-notify-apk-${{ github.sha }}
          path: ${{ runner.temp }}/apk
      # Without KVM the emulator interprets, which `android-emulator-runner`'s own
      # README warns "might not work at all" on newer API levels. The device node
      # exists on the standard runners; what is missing is a mode the runner's user
      # can open it with, which is the rule this adds. If a future image drops
      # `/dev/kvm` entirely this step still succeeds and the boot below is what
      # reports it — so the emulator's own log is where that answer comes from.
      - name: Let the runner's user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # `reactivecircus/android-emulator-runner` rather than `avdmanager` and
      # `adb wait-for-device` by hand: it owns the AVD creation, the boot wait and
      # the teardown, and every one of those is a thing this repository would
      # otherwise get wrong once and then maintain.
      #
      # Keep lavapipe rather than the SwiftShader mode #139 measured killing the
      # emulator. The default Blitsen renderer no longer asks it for a wgpu
      # device—it presents CPU pixels through ANativeWindow—but the emulator's
      # own compositor still needs a graphics backend. `-no-window` and
      # `-no-boot-anim` because nothing here reads pixels, and
      # `disable-animations` because `uiautomator dump` refuses while a window is
      # still moving and the permission dialog is a window that moves.
      - name: Notification coverage on a booted emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # No AVD snapshot cache: #243 had to bring this repository's cache usage
          # back inside its quota, and a per-API-level system image is the largest
          # entry anything here would add. A cold AVD creation costs a couple of
          # minutes on a job that is already waiting for a boot.
          disable-animations: true
          emulator-options: >-
            -no-window -gpu lavapipe -noaudio -no-boot-anim -no-snapshot-save
            -camera-back none -camera-front none
          # One line per command, and the harness invocation is not wrapped.
          # The action hands this block to `sh -c`, and a trailing backslash does
          # not survive that trip: the first run reached the emulator, read its
          # fingerprint, and then called the harness with a lone `"\\"` for an
          # argument, which printed the usage text and failed the job while
          # everything it was meant to test still worked.
          script: |
            adb devices -l
            adb shell getprop ro.build.fingerprint
            bun run --cwd packages/blitsen test:android-notify -- --apk ${{ runner.temp }}/apk/Notify.apk --package com.blitsen.notifyfixture --out ${{ runner.temp }}/android-notify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-notify-${{ matrix.api-level }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-notify
          if-no-files-found: ignore
