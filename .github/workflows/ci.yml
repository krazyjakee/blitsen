name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ten jobs across six runner labels is enough that two runs of the same branch
# queue behind each other, and the older one is answering a question nobody is
# asking any more. Superseded runs are cancelled — except on `main`, where every
# commit's result is the record of that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: no native toolchain, no display.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/blitsen

  # Issue #123: the workspace is tested on all three platforms, not just the one
  # this project is developed on. Clippy and rustfmt run once — a lint result is
  # not per-platform — and the tests run everywhere, because behaviour is.
  #
  # No engine library is installed on any of them: the runtime links QuickJS-ng
  # statically, so the engine arrives with the Rust build and there is nothing
  # for a job to go and find.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The M3 acceptance evidence, and the P5/P6 claim it stands on. Both harnesses
  # are headless: the bridge harness renders through the CPU rasterizer, and the
  # standalone check skips its frame-cadence assertion when no display is present
  # (see docs/M3.md).
  #
  # Issue #123: this ran on ubuntu alone, so every claim about the runtime, the
  # bridge and the export was a Linux claim wearing a cross-platform label. It
  # now runs on all three. `fail-fast: false` keeps the Linux result readable
  # while the other two settle — expect their first runs to surface toolchain
  # work rather than product failures.
  acceptance:
    name: Native acceptance (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      # Issue #90: one project, both runtimes, and the only difference allowed
      # is size. The engine is inside the runtime, so nothing is installed for it.
      #
      # First, because a standalone export links this and `test:standalone` will
      # not invent one. It was built after that step until the job first ran: a
      # checkout that had already built a runtime passed locally, and a clean
      # runner is the only place the order was ever load-bearing.
      - run: cargo build --release -p blitsen-runtime
      # Issue #121: an export embeds the notices staged beside the runtime it
      # links, and refuses to claim redistribution when they are absent. The
      # release job stages them right after the same build; CI never did, so
      # `test:hosts` built a Phase 2 export that correctly reported itself
      # uncleared and then failed the assertion that it should not be.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:native
      - run: bun run --cwd packages/blitsen test:m2
      - run: bun run --cwd packages/blitsen test:standalone
      - run: bun run --cwd packages/blitsen test:m3b
      - run: bun run --cwd packages/blitsen test:hosts
      # Issue #121: the notices an export owes travel inside it, and the gate
      # reads them back out of a real artifact — before and after signing.
      # The CLI under Node, which is what `npx blitsen` and every script line
      # start. Every gate in this repository runs under Bun, so `Bun` was always
      # defined and `npx blitsen build` died at step ③ for anyone who installed
      # the package instead of cloning it (#131). One real export, run.
      - name: Build and run an export under Node
        shell: bash
        run: |
          node packages/blitsen/bin/blitsen.mjs build examples/pong \
            --out "$RUNNER_TEMP/NodeBuilt" --force
          BLITSEN_STANDALONE_CHECK=1 "$RUNNER_TEMP/NodeBuilt"
      - run: bun run --cwd packages/blitsen test:licensing
      # Issue #67: the other way to run an application — served by a dev server
      # rather than read off disk. The fixture server runs inside the gate.
      - run: bun run --cwd packages/blitsen test:proxy

  # Frame determinism (issue #48). Replays one committed input trace twice, in
  # separate processes, and compares the digest sequences with each other and
  # with the committed golden. The DOM digest is portable and always gated; the
  # layout and pixel digests depend on installed fonts and CPU feature
  # detection, so they are gated only when this runner's rendering fingerprint
  # matches the golden's — see docs/M3.md. Diverging frames are uploaded as PNGs.
  determinism:
    name: Frame determinism (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/blitsen test:determinism
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: determinism-divergence-${{ github.sha }}
          path: ${{ github.workspace }}/target/determinism-divergence
          if-no-files-found: ignore
      - name: Frame cost
        run: bun run --cwd packages/blitsen frames --out ${{ github.workspace }}/frame-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-metrics-${{ github.sha }}
          path: ${{ github.workspace }}/frame-metrics.json

  # P6: byte-identical layout across platforms for the test corpus. This is the
  # cheapest cross-platform job in the file — it deliberately builds only
  # `blitsen-blitz`, which needs no JavaScript engine — and it is *not* the whole
  # of P6 on its own: the acceptance job above is what exercises the renderer
  # with a runtime behind it on the same three platforms (#123).
  conformance:
    name: Layout conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The corpus renders through the CPU rasterizer and needs no display; only
      # Blitz's font enumeration wants a system library, and only on Linux.
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      # Uncaptured, because the run reports which tier it gated and a silent
      # pass on a runner whose rasterizer differs would read like a full one.
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore

  # Product requirements P1 (size), P2 (cold start) and P3 (idle RAM). One export
  # build feeds both consumers: the size gate fails on regression, the benchmarks
  # only record and report, because a hosted runner's timings are too noisy to
  # gate on. Everything here is headless, so P2 and P3 are measured through the
  # proxies documented in docs/M3.md.
  #
  # Issue #123: measured per target, because P1 is one budget and six platforms.
  # Only the platform with a committed baseline is gated on growth — the size
  # gate says so itself for the others, and reports rather than failing.
  metrics:
    name: Size gate and benchmarks (${{ matrix.os }}, headless)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Pinned rather than floating: a compiler upgrade moves the native addon's
      # size and would trip the size gate as though Blitsen had regressed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      - run: bun install --frozen-lockfile
      # Before the measurement, not after it: what an export links is the Phase 2
      # runtime, and `measure` refuses to guess at one. This built after the
      # steps that need it until the job first ran and said so (#123).
      - run: cargo build --release -p blitsen-runtime
      - name: Measure the export
        run: bun run --cwd packages/blitsen measure --runs 5 --out ${{ github.workspace }}/measurements.json
      - name: Size gate
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - name: Startup and idle RAM
        run: bun run --cwd packages/blitsen bench --measurements ${{ github.workspace }}/measurements.json
      # Issue #89: recorded, never gated. The Phase 2 component breakdown moves
      # with the dependency tree, and a gate on it would fail for reasons that
      # are not regressions. The runtime it reads was built above.
      - name: Phase 2 size breakdown
        run: bun run --cwd packages/blitsen size:phase2 --out ${{ github.workspace }}/phase2-size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-size-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/phase2-size.json
      # The committed time series only grows from local runs: CI cannot push, so
      # it keeps its own per-commit copy here instead.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-${{ matrix.os }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #133: the release publishes six targets and every job above covers
  # three of them. These are the other three — the second architecture of a
  # platform already tested, plus x86-64 macOS, which is a different runner
  # image entirely. Without this job a `linux-arm64` runtime reaches users
  # having never had a Blitsen window opened on it.
  #
  # It is a smoke tier rather than a sixth full matrix, and the split is not
  # arbitrary. What changes with the architecture is codegen, the rasterizer's
  # CPU feature detection and whether an export links at all, so this job builds
  # exactly what the release publishes and then exercises those three things:
  # the package tests against the freshly built addon, the native acceptance
  # harness (a real frame, headless), a standalone export it runs, and the
  # layout corpus. What does *not* change with the architecture is product
  # behaviour — m2, m3b, host conformance, licensing and the proxy stay on the
  # three primary targets, where they already run on all three platforms.
  #
  # The size measurement is report-only by construction: `size:gate` says so
  # itself for a platform with no committed baseline, and the measurement is
  # uploaded so a baseline can be recorded per target from a real number rather
  # than guessed (#123).
  #
  # The three labels are overridable by the same repository variables release.yml
  # uses, so both files move together: the arm64 pair if this repository ever
  # goes private again, and the Intel macOS one whenever that image moves.
  architectures:
    name: ${{ matrix.target }} (smoke)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            library: libblitsen_node.so
            executable: blitsen-runtime
          - target: darwin-x64
            runner: ${{ vars.DARWIN_X64_RUNNER || 'macos-15-intel' }}
            library: libblitsen_node.dylib
            executable: blitsen-runtime
          - target: win32-arm64
            runner: ${{ vars.WIN32_ARM64_RUNNER || 'windows-11-arm' }}
            library: blitsen_node.dll
            executable: blitsen-runtime.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Blitz system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev
      # The same two artifacts release.yml builds and publishes for this target,
      # in one build, so the rest of the job runs against what a user would get.
      - name: Build the runtime
        run: cargo build --release -p blitsen-node -p blitsen-runtime
      - run: bun install --frozen-lockfile
      - name: Package tests against this target's artifacts
        run: bun test packages/blitsen
        env:
          BLITSEN_NATIVE_PATH: ${{ github.workspace }}/target/release/${{ matrix.library }}
          BLITSEN_RUNTIME_PATH: ${{ github.workspace }}/target/release/${{ matrix.executable }}
      - run: bun run --cwd packages/blitsen test:native
      # The generator resolves the dependency graph for this target, and it had
      # only ever run on Linux x86-64 (#134). An export links the runtime, so
      # the notices go beside it, exactly as the release job stages them.
      - name: Stage the third-party notices
        run: bun run --cwd packages/blitsen notices --root blitsen-runtime --out ${{ github.workspace }}/target/release
      - run: bun run --cwd packages/blitsen test:standalone
      - run: cargo test -p blitsen-blitz --test conformance -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-divergence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/target/conformance-divergence
          if-no-files-found: ignore
      - name: Measure the export (report only)
        run: bun run --cwd packages/blitsen measure --runs 3 --out ${{ github.workspace }}/measurements.json
      - name: Size report
        run: bun run --cwd packages/blitsen size:gate --measurements ${{ github.workspace }}/measurements.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-${{ matrix.target }}-${{ github.sha }}
          path: ${{ github.workspace }}/measurements.json

  # Issue #149: the seventh target, and the first that is not a row in the
  # release matrix at all (P5c). It gets a smoke tier, and the split follows
  # #133's precedent rather than inventing a new one — build exactly what the
  # target's artifact is, then exercise the things that change with the target
  # and nothing that does not.
  #
  # What changes on Android is the whole bottom of the graph: two cross-compiles
  # instead of a native build, QuickJS bindings generated rather than shipped,
  # OpenSSL built from source under the NDK, an audio backend that is neither
  # ALSA nor CoreAudio, and an entry point that is a `.so` the platform loads
  # rather than a program it execs. Every one of those is a thing that can break
  # without a single desktop job noticing. What does *not* change is product
  # behaviour, so m2, m3b, layout conformance, determinism and the size gate
  # stay on the targets that already run them — the same line #133 drew.
  #
  # ## What this job stops short of, and why it is not here yet
  #
  # It does not package an APK and it does not boot an emulator. Not a choice
  # about tiers: `blitsen build --android` cannot produce an APK containing
  # Blitsen's engine today. The project it generates is a cdylib whose one line
  # is `blitsen_android::android_main!()`, and `blitsen-android` exports no such
  # macro — it is itself a `cdylib`, so there is nothing to link it from. #148
  # is open on exactly this and says so; #143's spike settled which linking
  # approach works by building the `.so` directly. Until that lands there is no
  # artifact to install, and a job that installed nothing and passed would be
  # the one outcome this file is careful to avoid.
  #
  # Three prerequisites *were* found by trying, and are fixed rather than
  # documented: `RANLIB_<triple>` and `BINDGEN_EXTRA_CLANG_ARGS_<triple>`, which
  # `cargo apk` does not set and this graph needs (see `apkPlan`), and a
  # `min_sdk_version` of 26, which is where the NDK first ships the `libaaudio`
  # that `cpal` links. So what remains between here and an emulator tier is
  # #148's entry point and nothing else.
  #
  # The emulator half is written and runnable — `bun run --cwd packages/blitsen
  # test:android --apk <path> --package <id>` installs, launches, captures the
  # framebuffer and asserts against a control frame taken before the install.
  # Two things about the tier it will join, recorded here because they are the
  # decisions and not the plumbing:
  #
  #   * **The GPU mode is `-gpu lavapipe`, not `swiftshader_indirect`.** #139
  #     measured `swiftshader_indirect` reproducibly *killing the emulator* the
  #     moment the application initialised wgpu, including for a build that
  #     rasterised entirely on the CPU and used wgpu only to present — so the
  #     variable was SwiftShader's Vulkan, not the rasteriser. A hosted runner
  #     has no GPU, so `-gpu host` is not available and `swangle` is the same
  #     Vulkan under another name. Lavapipe is a different implementation
  #     entirely, and emulator 36.4.9 (10 Feb 2026) made it "the default
  #     graphics software renderer to improve Vulkan compatibility across all
  #     platforms". That is the one software path #139 did not try, and it is
  #     the reason to think a hosted emulator tier is possible at all. It is a
  #     hypothesis, not a result: nobody has yet run Vello's compute pipelines
  #     on lavapipe under the emulator's Vulkan translation.
  #   * **A hosted runner may not be enough.** GitHub's own changelog announced
  #     hardware-accelerated Android virtualisation for *larger* runners; that
  #     `/dev/kvm` works on the standard ones with a udev rule is user-reported
  #     and not documented by GitHub. Without KVM the emulator falls back to
  #     interpretation, which the action's own README warns "might not work at
  #     all" on newer API levels. If the tier turns out to need real hardware,
  #     the lever is a repository variable naming a self-hosted runner, exactly
  #     as the `architectures` job above takes its three labels.
  android:
    name: android (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      # `rquickjs-sys` ships pre-generated bindings for sixteen triples and none
      # is `*-linux-android`, so `crates/blitsen-quickjs/Cargo.toml` turns on its
      # `bindgen` feature for that target — which makes libclang a build-time
      # requirement Android alone has. The runner image's manifest lists Clang
      # 16, 17 and 18 under its tools and names no libclang package at all, so
      # this is installed rather than assumed: bindgen loads `libclang.so`, not
      # the `clang` driver, and the two are different packages.
      - name: Install libclang, which the Android QuickJS bindings need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      # No Blitz system libraries here, unlike every other Linux job in this
      # file: fontconfig, xkbcommon, wayland and X11 are the *host* platform's,
      # and nothing in an Android cross-compile links them. If a step below ever
      # starts wanting them, something has stopped being a cross-compile.
      #
      # The NDK is not installed either — the image carries one and sets
      # ANDROID_NDK_HOME to it, which is the whole of the prerequisite
      # `android-toolchain.mjs` refuses to provision. Asserted rather than
      # trusted, because an image that drops it would otherwise fail much later.
      - name: Check the NDK the image carries
        run: |
          test -n "$ANDROID_NDK_HOME" || { echo "ANDROID_NDK_HOME is unset"; exit 1; }
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \
            || { echo "$ANDROID_NDK_HOME has no C toolchain"; exit 1; }
          grep Pkg.Revision "$ANDROID_NDK_HOME/source.properties"
      # `cargo-ndk` rather than `cargo-apk`, and the difference is deliberate:
      # this step builds the *graph*, and cargo-apk's job starts after that with
      # a project it cannot generate yet (see the note above). cargo-ndk is also
      # what #142 measured the graph against, so a failure here is comparable
      # with the result that issue recorded.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Both default ABIs, in one invocation, because that is what one APK
      # carries (#148's decision 2) and because arm64 alone would leave the
      # emulator ABI unbuilt — which is precisely the one an emulator tier needs.
      - name: Cross-compile the Android entry point for both default ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 -P 26 build --release -p blitsen-android
      # A `.so` that links and does not export `android_main` is a crash inside
      # `dlopen` with nothing to read, so the symbol is checked rather than
      # assumed — it is the entire contract between the platform and this crate.
      # The ELF machine is checked too: a build that silently produced two copies
      # of the same architecture would satisfy every other assertion here.
      - name: The artifacts are what Android would load
        run: |
          set -euo pipefail
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for pair in "aarch64-linux-android:AArch64" "x86_64-linux-android:X86-64"; do
            triple="${pair%%:*}"
            machine="${pair##*:}"
            so="target/$triple/release/libblitsen_android.so"
            test -f "$so" || { echo "$so was not built"; exit 1; }
            "$readelf" -h "$so" | grep -q "$machine" \
              || { echo "$so is not $machine"; "$readelf" -h "$so"; exit 1; }
            "$nm" --dynamic --defined-only "$so" | grep -qw android_main \
              || { echo "$so exports no android_main, so NativeActivity cannot start it"; exit 1; }
            echo "$so: $machine, exports android_main, $(stat -c%s "$so") bytes"
          done
      # Issue #121: an artifact carries the notices it owes, and Android has no
      # platform package to take them from — `blitsen build --android` reads
      # `BLITSEN_NOTICES_PATH` and reports the APK uncleared for redistribution
      # when it is unset. Nothing had ever resolved that graph for an Android
      # triple, and the generator exits non-zero when a package's terms cannot
      # be honoured, so this is a real gate on a real dependency set rather than
      # a staging step for an artifact this job does not yet produce.
      - run: bun install --frozen-lockfile
      - name: The notices an Android artifact owes resolve
        run: |
          bun run --cwd packages/blitsen notices --target android-arm64 \
            --root blitsen-android --out ${{ runner.temp }}/android-notices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-notices-${{ github.sha }}
          path: ${{ runner.temp }}/android-notices
          if-no-files-found: ignore
