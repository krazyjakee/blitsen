# Keep compiler caching opt-in through `RUSTC_WRAPPER=sccache`. A repository
# wrapper would put a POSIX script between Cargo and rustc on every platform:
# Windows cannot execute it, and `/bin/sh` may discard Cargo's hyphenated
# `CARGO_BIN_EXE_*` variables before integration tests compile.

[target.x86_64-unknown-linux-gnu]
# Renderer-heavy test binaries spend a meaningful amount of time in the
# linker. Prefer mold in local and CI builds, while retaining the system linker
# as a fallback.
linker = "scripts/linux-linker.sh"

[target.aarch64-unknown-linux-gnu]
# Native Linux arm64 runners can use the same fast-linker path. Cross-target
# builds such as Android retain the linker selected by their own toolchain.
linker = "scripts/linux-linker.sh"
