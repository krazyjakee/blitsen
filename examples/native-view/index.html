<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>blitsen-view</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10121a; color: #e8ecff;
                   font: 14px system-ui, sans-serif }
      #stage { position: relative; width: 640px; height: 420px; margin: 24px auto;
               overflow: hidden; border-radius: 24px }
      #under { position: absolute; inset: 0; background: #c81e1e; z-index: -1 }
      #view  { position: absolute; left: 0; top: 0; width: 640px; height: 420px }
      #hud   { position: absolute; left: 16px; top: 16px; z-index: 1;
               background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="under"></div>
      <blitsen-view id="view"></blitsen-view>
      <div id="hud">DOM overlay above the surface — <span id="size">?</span></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
