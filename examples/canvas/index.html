<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>canvas 2D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; color: #e8ecff;
                   font: 14px system-ui, sans-serif }
      /* The stage is a stacking context so the underlay stays behind the canvas
         rather than escaping to the root, exactly as in the native-view demo. */
      #stage { position: relative; z-index: 0; width: 640px; height: 420px; margin: 24px auto }
      #under { position: absolute; inset: 0; z-index: -1; border-radius: 24px;
               background: linear-gradient(135deg, #7c2d92, #1d4ed8) }
      /* The backing store is 480x300 and the box is 592x372: the canvas is drawn
         at the box's size rather than sampled from a smaller bitmap, because
         what it holds is a display list. */
      #scene { position: absolute; left: 24px; top: 24px; width: 592px; height: 372px;
               border-radius: 20px }
      #hud   { position: absolute; left: 16px; top: 16px; z-index: 1;
               background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px }
      #shots { display: flex; gap: 12px; justify-content: center; align-items: center }
      #shots img { width: 96px; height: 60px; border-radius: 8px; background: #000 }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="under"></div>
      <canvas id="scene" width="480" height="300"></canvas>
      <div id="hud">DOM chip above the canvas — <span id="readout">?</span></div>
    </div>
    <p id="shots">
      <span>toDataURL:</span><img id="shot" alt="a frame, encoded and read back">
    </p>
    <script src="./app.js"></script>
  </body>
</html>
