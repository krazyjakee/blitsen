[package]
name = "s3-window"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.4", default-features = false, features = ["napi4"] }
napi-derive = "3.3"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "29"
winit = "0.30.13"

# A concluded experiment with its own dependency graph, not a workspace member.
[workspace]
