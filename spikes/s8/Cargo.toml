[package]
name = "s8-quickjs"
version = "0.0.0"
edition = "2024"
publish = false

# Outside the workspace on purpose (`exclude = ["spikes/*"]`): a spike must not
# be able to change what the product builds.
[dependencies]
blitsen-js = { path = "../../crates/blitsen-js" }
rquickjs-sys = "0.12.2"

[lib]
name = "s8_quickjs"
path = "src/lib.rs"

[[bin]]
name = "s8-quickjs"
path = "src/main.rs"

[[bin]]
name = "surface"
path = "src/bin/surface.rs"

[profile.release]
strip = "symbols"

[workspace]
