[package]
name = "blitsen-node"
description = "Phase 1 Node-API addon host for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
anyrender_vello = "0.13"
blitsen-core = { path = "../blitsen-core" }
blitsen-dom = { path = "../blitsen-dom" }
blitsen-js = { path = "../blitsen-js" }
blitsen-platform = { path = "../blitsen-platform" }
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "1efe22d2524d71ede5b94592204c21f0de644219" }
napi = { version = "3.4", default-features = false, features = ["napi6"] }
napi-derive = "3.3"
tokio = { version = "1.42", features = ["rt-multi-thread"] }
winit = "=0.31.0-beta.2"

[build-dependencies]
napi-build = "2.2"

[lints]
workspace = true
