[package]
name = "blitsen-node"
description = "Phase 1 Node-API addon host for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
blitsen-blitz = { path = "../blitsen-blitz" }
blitsen-core = { path = "../blitsen-core" }
blitsen-dom = { path = "../blitsen-dom" }
blitsen-host = { path = "../blitsen-host" }
blitsen-js = { path = "../blitsen-js" }
blitsen-quickjs = { path = "../blitsen-quickjs" }
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "1efe22d2524d71ede5b94592204c21f0de644219" }
# napi7 for `napi_detach_arraybuffer`, which is what a `postMessage` transfer
# list does to a buffer. Bun implements Node-API 8, so the level costs nothing
# here and buys a worker message that means the same thing on both hosts.
napi = { version = "3.4", default-features = false, features = ["napi7"] }
napi-derive = "3.3"
serde_json = "1"
winit = "=0.31.0-beta.2"

[build-dependencies]
napi-build = "2.2"

[lints]
workspace = true

[features]
# Wraps the global allocator to count per-frame allocations; see src/alloc.rs.
alloc-audit = ["blitsen-host/alloc-audit"]
