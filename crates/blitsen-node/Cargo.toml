[package]
name = "blitsen-node"
description = "Phase 1 Node-API addon host for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
blitsen-core = { path = "../blitsen-core" }
blitsen-dom = { path = "../blitsen-dom" }
blitsen-js = { path = "../blitsen-js" }
blitsen-platform = { path = "../blitsen-platform" }
napi = { version = "3.4", default-features = false, features = ["napi6"] }
napi-derive = "3.3"

[build-dependencies]
napi-build = "2.2"

[lints]
workspace = true
