[package]
name = "blitsen-core"
description = "Runtime-neutral DOM and JavaScript bridge for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The shipped runtime only reads bundles. The reference writer exists for the
# cross-language format tests and is deliberately absent from release binaries.
test-support = []

[[example]]
name = "bundle-reference"
required-features = ["test-support"]

[dependencies]
blake3 = "1.8"
blitsen-dom = { path = "../blitsen-dom" }
blitsen-js = { path = "../blitsen-js" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The bundle trailer's integrity digest. SHA-256 rather than the BLAKE3 above
# because the CLI writes bundles too, and `node:crypto` has no BLAKE3.
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
