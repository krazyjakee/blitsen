[package]
name = "blitsen-runtime"
description = "Phase 2 Blitsen runtime: the executable an exported application is linked into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "blitsen-runtime"
path = "src/main.rs"

# Which engine this runtime hosts. QuickJS-ng is the shipping one: statically
# linked, MIT, and gated on the 120 golden frames in `spikes/s8`. The
# JavaScriptCore build is kept because it is the other half of the conformance
# suite and the way a regression gets bisected across engines — not because an
# export ever links it. Both satisfy the same `JsEngine` trait, so only
# `engine.rs` knows which is present.
[features]
default = ["quickjs"]
quickjs = ["dep:blitsen-quickjs"]
# The JavaScriptCore shim is only linked when it is the engine, so a QuickJS
# build carries no dynamic-loading machinery it will never call.
javascriptcore = ["dep:blitsen-jsc"]

[dependencies]
blitsen-core = { path = "../blitsen-core" }
blitsen-host = { path = "../blitsen-host" }
blitsen-jsc = { path = "../blitsen-jsc", optional = true }
blitsen-js = { path = "../blitsen-js" }
blitsen-quickjs = { path = "../blitsen-quickjs", optional = true }
serde_json = "1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# `mallopt(M_ARENA_MAX)` applies the measured arena cap before any worker starts;
# an environment variable set from `main` would be too late for libc startup.
libc = "0.2"

[lints]
workspace = true
