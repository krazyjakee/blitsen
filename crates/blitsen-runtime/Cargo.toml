[package]
name = "blitsen-runtime"
description = "Phase 2 Blitsen runtime: the executable an exported application is linked into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The runtime is a library with two entry points, not one program carrying a
# mobile branch. Android loads a `cdylib` out of an APK and calls
# `android_main`; there is no `main` and no executable to read a bundle from, so
# the Android entry point is a sibling crate of a different artifact kind
# (`blitsen-android`, #142). Both link this library, so the session, the engine
# and the frame loop exist once and are compiled once.
[lib]
name = "blitsen_runtime"
path = "src/lib.rs"

[[bin]]
name = "blitsen-runtime"
path = "src/main.rs"

[dependencies]
blitsen-core = { path = "../blitsen-core" }
blitsen-host = { path = "../blitsen-host" }
blitsen-js = { path = "../blitsen-js" }
# The engine this runtime hosts: statically linked, MIT, and gated on the 120
# golden frames in `spikes/s8`. It reaches the rest of the tree through the
# engine-neutral `JsEngine` trait, so `engine.rs` is the only file that names it.
blitsen-quickjs = { path = "../blitsen-quickjs" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# `mallopt(M_ARENA_MAX)` applies the measured arena cap before any worker starts;
# an environment variable set from `main` would be too late for libc startup.
libc = "0.2"

[dev-dependencies]
blitsen-core = { path = "../blitsen-core", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
