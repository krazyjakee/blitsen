[package]
name = "blitsen-platform"
description = "Window, GPU, audio, network, and filesystem services for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The clipboard crate TECH.md §9 names. `wayland-data-control` is on because a
# Wayland session without XWayland has no other way to reach the clipboard.
arboard = { version = "3.6", features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Processor, memory, storage and OS identity for `src/os.rs`, which is one API
# over three platforms' very different sources — sysfs and os-release, IOKit,
# and the registry plus WMI. Only the `system` and `disk` halves are on: process
# enumeration, network counters, temperature sensors and the user database are
# each a capability of their own to decide on, and off by default they are
# neither shipped in the binary nor implied by this module.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# Dialogs exist only where the XDG desktop portal does; see `src/dialog.rs` for
# why macOS and Windows are absent rather than approximated. `rfd` speaks the
# portal's D-Bus interface itself, so this needs no GTK headers to build against
# and no async runtime to host, and it falls back to `zenity` where no portal is
# running. Default features carry the Wayland half of the parent-window
# identifier, which is what makes a dialog modal to our window there.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies]
raw-window-handle = "0.6"
rfd = "0.17"

[lints]
workspace = true
