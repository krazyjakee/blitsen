[package]
name = "blitsen-platform"
description = "JavaScript-free application, clipboard, dialog, and OS services for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Processor, memory, storage and OS identity for `src/os.rs`, which is one API
# over three platforms' very different sources — sysfs and os-release, IOKit,
# and the registry plus WMI. Only the `system` and `disk` halves are on: process
# enumeration, network counters, temperature sensors and the user database are
# each a capability of their own to decide on, and off by default they are
# neither shipped in the binary nor implied by this module.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# Two unrelated capabilities that share one predicate: both crates refuse to
# compile on Android rather than answer there, and each module says why.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard crate TECH.md §9 names. `wayland-data-control` is on because a
# Wayland session without XWayland has no other way to reach the clipboard.
#
# Off Android, where `arboard` has no backend at all — its `platform` module
# resolves to nothing there and the crate does not compile. See `src/clipboard.rs`
# for why that absence is inherited rather than worked around.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Resolve XDG, macOS Library and Windows known-folder locations through one
# platform-aware implementation rather than interpreting environment variables
# in the application bridge.
dirs = "6"
# The battery, which `sysinfo` above does not read at any feature level — it has
# no battery feature to turn on, so this is a second library rather than a
# heavier configuration of the one already here. Power is a fourth source on
# each platform (sysfs, IOKit, `GetSystemPowerStatus`) and this crate implements
# all of them behind one reading, which is the same argument `sysinfo` is here
# on. Not hand-rolled over `/sys/class/power_supply`: a wireless mouse's cell is
# published there too, and telling the machine's own battery from a peripheral's
# is the `scope` check this crate already makes. Its own `platform` module is a
# `compile_error!` on Android, which is why it is under this predicate; the
# reading there is `BatteryManager` over JNI and is not this.
starship-battery = "0.11"

# The process queues in `app` deliberately survive a panicking hand-off thread.
# Only Unix builds compile that single-instance implementation; the XDG dialog
# queue is narrower still, so this keeps the direct dependency off other targets.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
parking_lot.workspace = true

# Dialogs exist only where the XDG desktop portal does; see `src/dialog.rs` for
# why macOS and Windows are absent rather than approximated. `rfd` speaks the
# portal's D-Bus interface itself, so this needs no GTK headers to build against
# and no async runtime to host, and it falls back to `zenity` where no portal is
# running. Default features carry the Wayland half of the parent-window
# identifier, which is what makes a dialog modal to our window there.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies]
raw-window-handle = "0.6"
rfd = "0.17"

[lints]
workspace = true
