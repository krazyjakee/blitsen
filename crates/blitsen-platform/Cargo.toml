[package]
name = "blitsen-platform"
description = "JavaScript-free application, clipboard, dialog, shell, process, and OS services for Blitsen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Processor, memory, storage and OS identity for `src/os.rs`, which is one API
# over three platforms' very different sources — sysfs and os-release, IOKit,
# and the registry plus WMI. Only the `system` and `disk` halves are on: process
# enumeration, network counters, temperature sensors and the user database are
# each a capability of their own to decide on, and off by default they are
# neither shipped in the binary nor implied by this module.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# Desktop capabilities that do not compile on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard crate TECH.md §9 names. `wayland-data-control` is on because a
# Wayland session without XWayland has no other way to reach the clipboard.
#
# Off Android, where `arboard` has no backend at all — its `platform` module
# resolves to nothing there and the crate does not compile. See `src/clipboard.rs`
# for why that absence is inherited rather than worked around.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Resolve XDG, macOS Library and Windows known-folder locations through one
# platform-aware implementation rather than interpreting environment variables
# in the application bridge.
dirs = "6"
# One byte-stream API over filesystem Unix sockets and Windows named pipes. The
# application still owns framing, serialization, queueing and ownership; this
# crate only replaces the two platform transports.
interprocess = "2.4"
# The application and dialog queues deliberately survive a panicking worker.
parking_lot.workspace = true
# The battery, which `sysinfo` above does not read at any feature level — it has
# no battery feature to turn on, so this is a second library rather than a
# heavier configuration of the one already here. Power is a fourth source on
# each platform (sysfs, IOKit, `GetSystemPowerStatus`) and this crate implements
# all of them behind one reading, which is the same argument `sysinfo` is here
# on. Not hand-rolled over `/sys/class/power_supply`: a wireless mouse's cell is
# published there too, and telling the machine's own battery from a peripheral's
# is the `scope` check this crate already makes. Its own `platform` module is a
# `compile_error!` on Android, which is why it is under this predicate; the
# reading there is `BatteryManager` over JNI and is not this.
starship-battery = "0.11"

# The filesystem endpoint's recovery election uses the standard library's file
# lock, while the effective uid authenticates its directory and peers. `libc`
# is already in the Unix graph through `interprocess`.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

# A named pipe is system-wide, so its discoverable name and protected DACL use
# the caller's Windows SID. These are already `interprocess` dependencies on
# Windows; listing them directly adds no crate to that target graph.
#
# `Win32_UI_Shell` (with its `Common` item lists), `Win32_System_Com` and
# `Win32_UI_WindowsAndMessaging` are `blitsen/shell`'s (#384): `ShellExecuteW`
# for a URL or a file, and `SHOpenFolderAndSelectItems` for revealing one in
# Explorer through the API rather than an `explorer /select,` command line.
# `Win32_System_JobObjects` is `blitsen/process`'s (#383): a child is assigned
# to a job with kill-on-close, which is what makes terminating it terminate the
# tools it started, and what ends the tree when this process exits.
# Appearance also reads the animation setting through SystemParametersInfoW.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# `blitsen/shell` reveals an item through `org.freedesktop.FileManager1`, the
# selection interface every major Linux file manager implements (#384). The
# settings portal also supplies appearance and animation preferences (#385).
# This is the same zbus major, features and transport `blitsen-host` links for the
# notification portal, so naming it here compiles no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

# Reduce Motion is an accessibility setting NSWorkspace answers (#385).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSWorkspace", "std"] }

# `rfd` provides native asynchronous dialogs on every desktop target. On Linux
# it speaks the portal's D-Bus interface itself and falls back to `zenity`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Drive rfd's future from Blitsen's dialog worker. On macOS it dispatches the
# panel to the main thread; elsewhere it waits away from the frame-loop thread.
pollster = "1.0"
raw-window-handle = "0.6"
rfd = "0.17"

[lints]
workspace = true
