[package]
name = "blitsen-quickjs"
description = "Statically linked QuickJS-ng support for the Phase 2 host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blitsen-js = { path = "../blitsen-js" }
rquickjs-sys = "0.12.2"

[lints]
workspace = true

# Android is the one target rquickjs-sys ships no pre-generated bindings for.
# It carries them for sixteen triples and none is `*-linux-android`, so the
# `include!` in its build script fails outright rather than degrading. The
# crate's own error message names the answer — generate them instead — and
# measured against NDK r27c that is all it takes: `cargo ndk -t arm64-v8a -P 33
# check -p blitsen-android` goes from this being the only error left in the
# graph to finishing clean.
#
# What it costs, stated because it is a real prerequisite and not a free
# switch: `libclang` becomes a build-time requirement for the Android target
# specifically. Desktop is untouched — this is target-gated, the six shipping
# targets keep the shipped bindings, and nobody building for them needs clang
# installed. Whether CI provisions it or a developer does is #149 and #148.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs-sys = { version = "0.12.2", features = ["bindgen"] }
