<!-- conformance
Grid: fractional tracks, asymmetric gaps, a spanning item and the auto
placement that has to route around it.

380 of content width holds the fixed 100px track and two 20px column gaps, so
240 is left for the fractions: 1fr = 80 and 2fr = 160. Columns therefore start
at 10, 110 and 290. The two rows are fixed at 60 and 40 with a 10px row gap, so
they start at 10 and 80, and the container is 10 + 60 + 10 + 40 + 10 = 130 tall.
#d spans columns 1 and 2, which is 80 + 20 + 160 = 260, and sparse auto
placement puts #e in the only cell left.

@oracle
@box #grid 0 0 400 130
@box #a 10 10 80 60
@box #b 110 10 160 60
@box #c 290 10 100 60
@box #d 10 80 260 40
@box #e 290 80 100 40
@pixel 50 40 #ef4444ff
@pixel 100 40 #f8fafcff
@pixel 200 40 #22c55eff
@pixel 340 40 #3b82f6ff
@pixel 200 100 #a855f7ff
@pixel 340 100 #f59e0bff
-->
<!doctype html>
<html>
  <head>
    <style>
      html, body { margin: 0; background: #ffffff }
      #grid { display: grid; grid-template-columns: 1fr 2fr 100px;
              grid-template-rows: 60px 40px; gap: 10px 20px; padding: 10px;
              background: #f8fafc }
      #a { background: #ef4444 }
      #b { background: #22c55e }
      #c { background: #3b82f6 }
      #d { grid-column: 1 / 3; background: #a855f7 }
      #e { background: #f59e0b }
    </style>
  </head>
  <body>
    <div id="grid">
      <div id="a"></div><div id="b"></div><div id="c"></div>
      <div id="d"></div><div id="e"></div>
    </div>
  </body>
</html>
