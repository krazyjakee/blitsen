[package]
name = "blitsen-blitz"
description = "Blitz implementation of Blitsen's renderer-neutral DOM boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyrender = "0.13"
blitsen-dom = { path = "../blitsen-dom" }
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73" }
# The meta-crate pulls blitz-dom with default features off, which drops
# system-fonts — without it Parley has no font sources and every glyph renders
# blank. Taken explicitly rather than via `default` so the list is the one
# Blitsen has decided on: `svg` is what parses an `<svg>` subtree and an SVG
# subresource (#238), and custom-widget is the seam `<blitsen-view>` uses.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73", default-features = false, features = ["system-fonts", "woff", "accessibility", "file-input", "custom-widget", "svg"] }
# The cursor a resolved `cursor` keyword names. Blitz keeps its own copy of
# this mapping private, and the enum is what the shell takes, so it is named
# here directly rather than through a re-export that does not exist.
cursor-icon = "1.2"
data-url = "0.3.2"
html-escape = "0.2"
# blitz-dom decodes `<img>` and `background-image` with the `image` crate but
# takes it with `default-features = false`, which leaves it with no codecs at
# all: every image fails to decode and the element silently lays out at zero
# height. Depending on it here selects the formats through feature unification.
# Not `default`, which drags in TIFF/EXR/AVIF and friends that no drop-in
# framework build emits. SVG is not among them: it is not a raster format and
# arrives through blitz-dom's `svg` feature above, which parses it with usvg.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kurbo = "0.13"
# The text layout blitz-dom builds is Parley's, and its geometry is only
# readable through Parley's own cursor and selection types. Taken at the
# version blitz-dom takes, so both crates name one `Layout`.
parley = "0.11"
peniko = "0.6"
style = { package = "stylo", version = "0.20" }

[dev-dependencies]
anyrender_vello_cpu = "0.16"
blitsen-core = { path = "../blitsen-core" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "111ed2f7224e49cd3177ef3cb5990efc279d3e73", default-features = false, features = ["custom-widget", "svg"] }
png = "0.18"
serde_json = "1"

[lints]
workspace = true
