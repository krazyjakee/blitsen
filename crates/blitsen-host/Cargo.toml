[package]
name = "blitsen-host"
description = "Engine-neutral Blitsen host: DOM bridge, window session, frame loop and harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyrender = "0.12"
anyrender_vello = "0.13"
anyrender_vello_cpu = "0.15"
base64 = "0.22"
blitsen-blitz = { path = "../blitsen-blitz" }
blitsen-core = { path = "../blitsen-core" }
blitsen-dom = { path = "../blitsen-dom" }
blitsen-js = { path = "../blitsen-js" }
blitsen-platform = { path = "../blitsen-platform" }
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "1efe22d2524d71ede5b94592204c21f0de644219" }
# `<blitsen-view>` composites through the paint-side custom-widget seam. Defaults
# are off because blitz-paint's `svg` default turns on blitz-dom/svg, which does
# not compile at this pin.
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "1efe22d2524d71ede5b94592204c21f0de644219", default-features = false, features = ["custom-widget"] }
data-url = "0.3.2"
# The third-party notices an artifact carries are gzipped inside it (#121), and
# reading them belongs to the application's files rather than to the appended
# section: an APK carries the same file under `assets/` (#144). Already in the
# tree behind `blitsen-runtime`, so this links no new crate.
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# `crypto.getRandomValues`, and nothing else. The platform generator itself
# rather than a PRNG seeded from it: this is the entropy an application's UUIDs
# and tokens are built on. Already in the tree behind `rand_core`, so linking it
# directly compiles no new crate.
getrandom = "0.3"
peniko = "0.6"
png = "0.18"
# Blitsen's own `fetch`, so the Phase 2 host swap does not change what the
# application sees. Same version Blitz's net provider already resolves to.
reqwest = { version = "0.13", default-features = false, features = ["charset", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# `WebSocket`, the crate TECH.md §8 names. `native-tls` rather than a bundled
# root store because `reqwest` above already resolves to it: `wss:` then trusts
# the same platform certificates `https:` does, and no second TLS stack is built.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }
url = "2"
# Audio (#81). A pure-Rust implementation of the Web Audio API itself rather
# than a playback library the graph would have to be rebuilt on top of; it sits
# on `cpal` regardless, so this is the same backend with the spec-shaped layer
# already written. Decoding is Symphonia. Note the tree carries two Symphonia
# majors — 0.6 directly, and 0.5 through `creek`, which is not optional — and no
# feature selection collapses them.
web-audio-api = "1.7"
winit = "=0.31.0-beta.2"

# An engine to drive `tests/surface_lifecycle.rs` with. QuickJS rather than
# JavaScriptCore because it needs nothing found on the machine at runtime, and
# because it is the engine the platforms that really do destroy a surface would
# be hosting (#146).
[dev-dependencies]
blitsen-quickjs = { path = "../blitsen-quickjs" }

# No libtest harness: a winit event loop must be created on the main thread, and
# libtest runs every test on one it spawned. `fn main()` is the only way to be
# on the thread the platform requires.
[[test]]
name = "surface_lifecycle"
harness = false

# An APK's `assets/`, read through `AAssetManager` (#144). Android only: the
# other six targets have no asset manager, and the same provider reads a
# directory standing in for one, which is what the tests run against.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false }

# Vello's Metal compute path can wedge the display GPU on Intel Macs before
# wgpu can report device loss (#229). Use vello_cpu to rasterize on the CPU and
# present its finished RGBA buffer through softbuffer. Core Animation remains
# the system compositor, but Blitsen does not create a wgpu/Metal renderer.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
anyrender_vello_cpu = { version = "0.15", features = ["softbuffer_window_renderer"] }

[lints]
workspace = true

[features]
# Wraps the global allocator to count per-frame allocations; see src/alloc.rs.
alloc-audit = []
