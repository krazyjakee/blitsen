[package]
name = "blitsen-host"
description = "Engine-neutral Blitsen host: DOM bridge, window session, frame loop and harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyrender = "0.13"
anyrender_vello = "0.14"
anyrender_vello_cpu = "0.16"
base64.workspace = true
blitsen-blitz = { path = "../blitsen-blitz" }
blitsen-core = { path = "../blitsen-core" }
blitsen-dom = { path = "../blitsen-dom" }
blitsen-js = { path = "../blitsen-js" }
blitsen-platform = { path = "../blitsen-platform" }
blitz.workspace = true
# `<blitsen-view>` composites through the paint-side custom-widget seam, and
# `svg` is what paints an `<svg>` subtree once blitz-dom has parsed it (#238).
# Both are named rather than taken through `default`, so the feature list is a
# decision this file records instead of whatever upstream defaults to next.
blitz-paint = { workspace = true, features = ["custom-widget", "svg"] }
# Read compressed native dependency notices from application assets.
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# The report descriptor of an opened `blitsen/hid` device (#247). A descriptor
# is a bit-level grammar with global/local item state, delimiters and pushes,
# and the two things Blitsen needs from it — the longest report of each kind, so
# a write is bounded by what the device declared, and every top-level collection
# behind one handle, so a composite device cannot smuggle a keyboard past the
# filter — both require parsing the whole of it. `default-features = false`
# drops both of the crate's defaults. `hut` is the usage-table names, and this
# reads numbers and compares them with the four protected Generic Desktop
# usages, so it never prints one; `std` only adds the standard-library error
# traits to a parse failure this module already maps onto its own diagnostics.
#
# Not target-specific, unlike the backends that produce the descriptor: Android
# reads the same bytes off the same device through a `GET_DESCRIPTOR` control
# transfer (#248), and the gate a descriptor exists to feed — the bounds, and
# the collections a composite device would otherwise hide — has to be the same
# gate there. The crate is pure Rust and links nothing.
hidreport = { version = "0.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot.workspace = true
peniko = "0.6"
png = "0.18"
# EventSource and application asset loading retain the shared HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["charset", "native-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
# Runtime diagnostics consume the mappings a user's bundler emitted. The crate
# owns Source Map v3 decoding (including indexed maps); Blitsen keeps URL and
# sourceMappingURL policy because those are application-loader concerns.
sourcemap = "9.3.2"
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
# Audio (#81). A pure-Rust implementation of the Web Audio API itself rather
# than a playback library the graph would have to be rebuilt on top of; it sits
# on `cpal` regardless, so this is the same backend with the spec-shaped layer
# already written. Decoding is Symphonia. Note the tree carries two Symphonia
# majors — 0.6 directly, and 0.5 through `creek`, which is not optional — and no
# feature selection collapses them.
web-audio-api = "1.7"
winit.workspace = true

# Legacy language services and QuickJS are test-only DOM regression fixtures.
[dev-dependencies]
fixed_decimal = "0.7"
icu_collator = { version = "2", features = ["compiled_data"] }
icu_datetime = { version = "2", features = ["compiled_data", "unstable_jiff_0_2"] }
icu_decimal = { version = "2", features = ["compiled_data"] }
icu_experimental = "0.6"
icu_list = { version = "2", features = ["compiled_data"] }
icu_locale_core = "2"
icu_plurals = { version = "2", features = ["compiled_data"] }
jiff = "0.2"
sys-locale = "0.3"
writeable = "0.6"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
getrandom = "0.4"
blitsen-core = { path = "../blitsen-core", features = ["test-support"] }
blitsen-quickjs = { path = "../blitsen-quickjs" }
tempfile.workspace = true

# Desktop notifications use the native toast/notification-center APIs on
# Windows and macOS and the freedesktop notification service on Linux.
#
# `preview-macos-un` selects the crate's `UNUserNotificationCenter` backend, and
# it stays selected for development runs as well as exports (#253). The library
# does carry the other macOS backend, `mac-notification-sys`, and switching to
# it for unbundled hosts would be the smaller change — but that path submits
# through `get_bundle_identifier_or_default`, which resolves to an installed
# application's identifier, so a development notification would arrive as
# Terminal's and the permission the user granted would be Terminal's. Real
# permission, actions, replacement and close are only offered by the modern API
# in the first place, so trading them for a borrowed identity would cost
# behaviour twice over. What the development host gets instead is a bundle of
# its own, and `check_bundle` — the crate's own `NSBundle` reader, re-exported
# from `mac-usernotifications` — is what tells it whether it has one before a
# call reaches a framework that aborts the process without it.
[target.'cfg(not(target_os = "android"))'.dependencies]
notify-rust = { version = "4.18.0", default-features = false, features = ["preview-macos-un", "z-with-tokio"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = "0.11.2"

# An APK's `assets/`, read through `AAssetManager` (#144). Android only: the
# other six targets have no asset manager, and the same provider reads a
# directory standing in for one, which is what the tests run against.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0", features = ["native-activity"] }
# Android's software default rasterises into an RGBA buffer and presents it
# through ANativeWindow. This reuses the dependency and softbuffer presenter
# already selected for Intel macOS rather than introducing another backend.
anyrender_vello_cpu = { version = "0.16", features = ["softbuffer_window_renderer"] }
jni = "0.22.4"
ndk = { version = "0.9", default-features = false }

# Linux's StatusNotifierItem protocol is D-Bus based and needs no GTK or
# appindicator development libraries. Windows and macOS use their native tray
# implementations; keeping these target-specific avoids irrelevant platform
# dependencies in every runtime.
[target.'cfg(target_os = "linux")'.dependencies]
# The notification portal and org.freedesktop.Application activation service
# use the same zbus major and Tokio transport already linked by notify-rust.
# Naming it directly adds no crate to the resolved graph; `blocking-api` only
# exposes zbus's synchronous facade for the frame-thread submission calls.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
# `blitsen/hid` (#246, spikes/s10). One crate with three native backends, and
# each of the three lines named below is a choice rather than a default: the
# crate's own default (`linux-static-hidraw`) would compile its vendored C
# library and require a `libudev` development package to build against. Here
# `linux-native-basic-udev` is the pure-Rust hidraw backend, which locates a
# node through `basic-udev` and links neither libudev nor libusb. Access to the
# node it finds is still a udev rule's to grant; that is packaging, and
# `blitsen doctor` and `blitsen build` say so rather than the runtime trying.
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
ksni = "0.3.6"
# X11 desktops publish their toolkit scale through XSettings separately from
# Xft/DPI. Winit only consumes the latter, so XFCE's 2x UI scale would otherwise
# leave a native Blitsen window at 1x (issue #348).
x11rb = { version = "0.14.0", default-features = false }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# The status item, and — through `tray_icon::menu`, which is `muda` — the
# application menu as well (#249). One crate builds a menu for both surfaces,
# which is why the menu bar and the macOS main menu cost no new dependency:
# `tray-icon` already links `muda`, and these are the same authors' pair.
tray-icon = { version = "0.24.2", default-features = false }

# `TranslateAcceleratorW`, and nothing else. A win32 menu bar delivers its own
# clicks through the window subclass `muda` installs, but an accelerator only
# becomes one if the message pump translates it, and the pump is winit's — so
# the hook winit provides for this is where the call has to happen
# (`native_window/session.rs`). Already in the tree behind winit and `muda`, at
# the major both resolve to, so naming it here compiles no new crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
# `windows-native` reaches the HID class driver through `windows-sys` instead of
# compiling hidapi's C, so the toolchain requirement stays the one `windows-sys`
# already imposes.
hidapi = { version = "2.6.6", default-features = false, features = ["windows-native"] }
# Addressable Windows toasts (#251). `notify-rust` above stays: it is the desktop
# vocabulary every backend reports in, and it owns Linux and macOS. What it
# cannot do is name a Windows toast — its backend sets no tag, keeps no handle
# and never reads the notifier — so an ID it returns can never be replaced,
# removed or asked about again. This crate is the same toast built addressably:
# it maintains the toast XML and the WinRT event plumbing upstream, and it
# exposes the tag and group that Windows itself uses to replace a delivered
# toast and to remove one from notification history. Blitsen forks no second
# toast implementation to get that.
winrt-toast-reborn = "0.3.8"
winreg = "0.56"
# `ToastNotifier::Setting()`, and nothing else. Whether the user, the
# administrator or policy has switched this application's toasts off is the only
# notification permission state Windows has, and no toast library in the tree
# surfaces it. The crate is already resolved behind the one above, so naming it
# here links nothing new.
windows = { version = "0.62", features = ["UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Notifications"] }
# The `windows::core::implement` macro expands through this exact companion
# crate. A newer `windows-core` is also present behind winit; keeping the direct
# pairing explicit prevents the generated COM vtables from binding that one.
windows-core = "=0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
# `macos-shared-device` is the one feature that changes behaviour rather than
# which backend is built: it opens IOHID with `kIOHIDOptionsTypeNone` instead of
# seizing the device. Blitsen must not take a device away from the rest of the
# system merely because an application read one report from it.
hidapi = { version = "2.6.6", default-features = false, features = ["macos-shared-device"] }
mac-usernotifications = "0.3.1"
# `mac-usernotifications` owns notification submission, while its delegate is
# intentionally private and drops responses for requests the current process
# did not submit. Cold activation is precisely such a response, so Blitsen
# installs a small delegate that persists its own encoded request identifiers
# before the JavaScript bridge exists. These are already resolved by the crate
# above; naming them directly adds no frameworks or duplicate versions.
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = ["UNNotification", "UNNotificationRequest", "UNNotificationResponse", "UNUserNotificationCenter"] }

# Vello's Metal compute path can wedge the display GPU on Intel Macs before
# wgpu can report device loss (#229). Use vello_cpu to rasterize on the CPU and
# present its finished RGBA buffer through softbuffer. Core Animation remains
# the system compositor, but Blitsen does not create a wgpu/Metal renderer.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
anyrender_vello_cpu = { version = "0.16", features = ["softbuffer_window_renderer"] }

[lints]
workspace = true

[features]
# Wraps the global allocator to count per-frame allocations; see src/alloc.rs.
alloc-audit = []
# Qualification only. Android defaults to CPU rasterisation because Vello's
# wgpu device request cannot be satisfied by the API 32/33 AVD's lavapipe
# adapter and classic Vello is not established across physical mobile GPUs
# (#151). This feature keeps the GPU path buildable for explicit device tests;
# it is not a product default or an automatic fallback.
android-vello-gpu = []
